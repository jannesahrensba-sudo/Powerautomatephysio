# ---------------------------------------------------------------------
# DIAGNOSESTREIFEN - zeigt die Werte, statt sie zu vermuten.
#
# Einfuegen: im Baum conAnlagen auswaehlen, Rechtsklick -> Code
# einfuegen. Der Streifen landet am Ende von conAnlagen; ziehen Sie ihn
# im Baum ueber conAnlagenAktionen, damit er nicht unter den
# Schaltflaechen verschwindet.
#
# DANN: Vorschau starten (Wiedergeben), Schritt 1 bis 3 durchspielen
# und die fuenf Zeilen ablesen.
#
# WICHTIG: Im Studio-Editor sind alle Variablen leer - dort steht
# ueberall LEER und das Formular sagt zu Recht "Keine anzuzeigenden
# Elemente". Aussagekraeftig ist nur die VORSCHAU.
#
# Wenn die Diagnose durch ist: conDiagnose im Baum loeschen.
# ---------------------------------------------------------------------

- conDiagnose:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      Fill: =clrWarnungSanft
      FillPortions: =0
      Height: =190
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =2
      BorderColor: =clrWarnung
      BorderThickness: =1
      PaddingTop: =spS
      PaddingBottom: =spS
      PaddingLeft: =spM
      PaddingRight: =spM
      RadiusTopLeft: =radM
      RadiusTopRight: =radM
      RadiusBottomLeft: =radM
      RadiusBottomRight: =radM
    Children:

      - lblDiagTitel:
          Control: Label
          Properties:
            Text: ="Diagnose - bitte diese fünf Zeilen ablesen"
            Color: =clrWarnung
            Size: =fsKlein
            FontWeight: =FontWeight.Semibold
            Height: =24
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0

      # 1) Ist ein Patient gewaehlt? Ohne den geht nichts.
      - lblDiag1:
          Control: Label
          Properties:
            Text: |-
              =If(
                  IsBlank(gblPatient.ID),
                  "1  Patient: LEER",
                  "1  Patient: Nr. " & gblPatient.ID
              )
            Color: =If(IsBlank(gblPatient.ID), clrFehler, clrText)
            Size: =fsKlein
            Height: =22
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0

      # 2) Hat das Speichern eine Zeile angelegt?
      - lblDiag2:
          Control: Label
          Properties:
            Text: |-
              =If(
                  IsBlank(gblAufnahme.ID),
                  "2  Gespeicherte Aufnahme: LEER",
                  "2  Gespeicherte Aufnahme: Nr. " & gblAufnahme.ID
              )
            Color: =If(IsBlank(gblAufnahme.ID), clrFehler, clrText)
            Size: =fsKlein
            Height: =22
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0

      # 3) Ist die Datenquelle ueberhaupt lesbar?
      - lblDiag3:
          Control: Label
          Properties:
            Text: |-
              ="3  Zeilen in Rezepte: " & CountRows(Rezepte)
            Color: =clrText
            Size: =fsKlein
            Height: =22
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0

      # 4) Findet die Formel, die im Formular unter Item steht,
      #    tatsaechlich eine Zeile?
      - lblDiag4:
          Control: Label
          Properties:
            Text: |-
              =With(
                  {
                      r: First(
                          Sort(
                              Filter(Rezepte, PatientID = gblPatient.ID),
                              ID,
                              SortOrder.Descending
                          )
                      )
                  },
                  If(
                      IsBlank(r.ID),
                      "4  Formular findet: NICHTS",
                      "4  Formular findet: Nr. " & r.ID
                  )
              )
            Color: |-
              =With(
                  {
                      r: First(
                          Sort(
                              Filter(Rezepte, PatientID = gblPatient.ID),
                              ID,
                              SortOrder.Descending
                          )
                      )
                  },
                  If(IsBlank(r.ID), clrFehler, clrErfolg)
              )
            Size: =fsKlein
            FontWeight: =FontWeight.Semibold
            Height: =22
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0

      # 5) Ist das Anlagenfeld lesbar? Zeigt Studio hier eine rote
      #    Markierung an .Anlagen, sind Anlagen an der Liste
      #    abgeschaltet - dann hilft nur die Listeneinstellung.
      - lblDiag5:
          Control: Label
          Properties:
            Text: |-
              =With(
                  {
                      r: First(
                          Sort(
                              Filter(Rezepte, PatientID = gblPatient.ID),
                              ID,
                              SortOrder.Descending
                          )
                      )
                  },
                  If(
                      IsBlank(r.ID),
                      "5  Anlagen: keine Zeile zum Prüfen",
                      "5  Anlagen an dieser Zeile: " & CountRows(r.Anlagen)
                  )
              )
            Color: =clrText
            Size: =fsKlein
            Height: =22
            FillPortions: =0
            Wrap: =false
            PaddingLeft: =0
