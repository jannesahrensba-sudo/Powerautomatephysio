                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - conPatSuchkopf:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =56
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =spM
                            Children:
                              - lblPatTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Patienten"
                                    Color: =clrText
                                    Size: =fsTitel
                                    FontWeight: =FontWeight.Semibold
                                    FillPortions: =1
                                    Height: =40
                                    Wrap: =false
                                    PaddingLeft: =0
                                    VerticalAlign: =VerticalAlign.Middle
                              - btnPatNeu:
                                  Control: Classic/Button
                                  Properties:
                                    Text: ="Patient aufnehmen"
                                    OnSelect: |-
                                      =Set(gblPatient, Blank());
                                      Set(gblRezept, Blank());
                                      Set(gblAufnahmeSchritt, 1);
                                      Set(gblAufnahmePatientNeu, true);
                                      Set(gblUngespeichert, false);
                                      Set(gblFormularReset, true); Set(gblFormularReset, false);
                                      Set(gblMeldung, ""); Set(gblMeldungArt, "");
                                      Set(gblAnsicht, "Aufnahme")
                                    Fill: =clrAkzent
                                    Color: =clrFlaecheWeiss
                                    HoverFill: =clrAkzentDunkel
                                    PressedFill: =clrAkzentDunkel
                                    BorderThickness: =0
                                    Size: =fsNormal
                                    FontWeight: =FontWeight.Semibold
                                    Height: =hTouch
                                    Width: =220
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                        - conPatSuche:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - txtPatSuche:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =""
                                    HintText: ="Nachname oder Vorname eingeben"
                                    Reset: =gblFormularReset
                                    DelayOutput: =true
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - lblPatSuchHinweis:
                                  Control: Label
                                  Properties:
                                    # StartsWith ist für SharePoint delegierbar. Wird die
                                    # Delegierungsgrenze erreicht, wird das hier ehrlich gesagt.
                                    Text: |-
                                      =If(
                                          Len(txtPatSuche.Text) = 0,
                                          "Bitte mindestens einen Buchstaben eingeben. Die Suche läuft auf dem Server (Anfang des Namens).",
                                          CountRows(galPatienten.AllItems) = 0,
                                          "Kein Treffer. Bitte Schreibweise prüfen oder Patient neu aufnehmen.",
                                          CountRows(galPatienten.AllItems) >= cfgZeilenGrenze,
                                          "Es werden nur die ersten " & cfgZeilenGrenze & " Treffer angezeigt. Bitte Suchbegriff verfeinern.",
                                          CountRows(galPatienten.AllItems) & " Treffer."
                                      )
                                    Color: |-
                                      =If(CountRows(galPatienten.AllItems) >= cfgZeilenGrenze, clrWarnung, clrTextLeise)
                                    Size: =fsKlein
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - galPatienten:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =If(
                                          Len(txtPatSuche.Text) = 0,
                                          Sort(Patientenstamm, ID, SortOrder.Descending),
                                          Sort(
                                              Filter(
                                                  Patientenstamm,
                                                  StartsWith(Nachname, txtPatSuche.Text) Or StartsWith(Vorname, txtPatSuche.Text)
                                              ),
                                              Nachname,
                                              SortOrder.Ascending
                                          )
                                      )
                                    Layout: =Layout.Vertical
                                    TemplateSize: =72
                                    TemplatePadding: =0
                                    FillPortions: =1
                                    ShowScrollbar: =true
                                    DelayItemLoading: =true
                                  Children:
                                    - rectPatZeile:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =If(ThisItem.IsSelected, clrAkzentSanft, clrFlaeche)
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                          X: =0
                                          Y: =0
                                          OnSelect: =Select(Parent)
                                    - rectPatTrenner:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrRahmen
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          OnSelect: =Select(Parent)
                                    - lblPatName:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =Trim(Coalesce(ThisItem.Nachname, "") & ", " & Coalesce(ThisItem.Vorname, ""))
                                          Color: =clrText
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          X: =spS
                                          Y: =10
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblPatDetail:
                                        Control: Label
                                        Properties:
                                          # Geburtsdatum und Patientennummer helfen bei gleichen Namen.
                                          Text: |-
                                            =If(IsBlank(ThisItem.Geburtsdatum), "Geburtsdatum fehlt",
                                                "geb. " & Text(ThisItem.Geburtsdatum, DateTimeFormat.ShortDate)) &
                                             "   |   " &
                                             If(IsBlank(ThisItem.'Patienten ID'), "ohne Nummer", "Nr. " & ThisItem.'Patienten ID')
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          X: =spS
                                          Y: =36
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =20
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - btnPatOeffnen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Akte öffnen"
                                          OnSelect: |-
                                            =If(
                                                gblUngespeichert,
                                                Set(gblWechselZiel, "Patientenakte"); Set(gblFrageWechsel, true),
                                                Set(gblPatient, ThisItem);
                                                Set(gblRezept, Blank());
                                                Set(gblDoku, Blank());
                                                Set(gblFormularReset, true); Set(gblFormularReset, false);
                                                Set(gblMeldung, ""); Set(gblMeldungArt, "");
                                                Set(gblAnsicht, "Patientenakte")
                                            )
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrAkzent
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          Size: =fsKlein
                                          X: =Parent.TemplateWidth - 180
                                          Y: =14
                                          Width: =172
                                          Height: =hTouch
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: PATIENTENAKTE (Stammdaten + Verlauf)
                  # =====================================================
                  - conViewAkte:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Patientenakte"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - lblAkteLeer:
                            Control: Label
                            Properties:
                              Visible: =IsBlank(gblPatient)
                              Text: ="Es ist kein Patient ausgewählt. Bitte zuerst im Bereich Patienten einen Patienten öffnen oder neu aufnehmen."
                              Color: =clrTextLeise
                              Size: =fsNormal
                              Height: =60
                              FillPortions: =0
                              Wrap: =true
                              PaddingLeft: =0

                        # --- Karte: Stammdaten ------------------------
                        - conAkteStamm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblPatient))
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =340
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAkteStammTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Stammdaten"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - conAkteFelder:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutWrap: =true
                                    LayoutGap: =spM
                                  Children:
                                    - conFeldVorname:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =If(conPraxisApp.Width >= bpBreit, 300, conAkteFelder.Width - spM)
                                          Height: =78
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblFeldVorname:
                                              Control: Label
                                              Properties:
                                                Text: ="Vorname *"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =20
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - txtStammVorname:
                                              Control: Classic/TextInput
                                              Properties:
                                                Default: =Coalesce(gblPatient.Vorname, "")
                                                Reset: =gblFormularReset
                                                HintText: ="Vorname"
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =If(gblPruefeAkte And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                PaddingLeft: =spM
                                                RadiusTopLeft: =radM
                                                RadiusTopRight: =radM
                                                RadiusBottomLeft: =radM
                                                RadiusBottomRight: =radM
                                                OnChange: =Set(gblUngespeichert, true)
                                    - conFeldNachname:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =If(conPraxisApp.Width >= bpBreit, 300, conAkteFelder.Width - spM)
                                          Height: =78
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblFeldNachname:
                                              Control: Label
                                              Properties:
                                                Text: ="Nachname *"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =20
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - txtStammNachname:
                                              Control: Classic/TextInput
                                              Properties:
                                                Default: =Coalesce(gblPatient.Nachname, "")
                                                Reset: =gblFormularReset
                                                HintText: ="Nachname"
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =If(gblPruefeAkte And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                PaddingLeft: =spM
                                                RadiusTopLeft: =radM
                                                RadiusTopRight: =radM
                                                RadiusBottomLeft: =radM
                                                RadiusBottomRight: =radM
                                                OnChange: =Set(gblUngespeichert, true)
                                    - conFeldGeburt:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =If(conPraxisApp.Width >= bpBreit, 300, conAkteFelder.Width - spM)
                                          Height: =78
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblFeldGeburt:
                                              Control: Label
                                              Properties:
                                                Text: ="Geburtsdatum"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =20
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - dpStammGeburt:
                                              Control: Classic/DatePicker
                                              Properties:
                                                DefaultDate: =gblPatient.Geburtsdatum
                                                Reset: =gblFormularReset
                                                Format: =DateTimeFormat.ShortDate
                                                StartYear: =1920
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =clrRahmen
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                OnChange: =Set(gblUngespeichert, true)
                                    - conFeldNummer:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =If(conPraxisApp.Width >= bpBreit, 300, conAkteFelder.Width - spM)
                                          Height: =78
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblFeldNummer:
                                              Control: Label
                                              Properties:
                                                # Geschaeftliche Patientennummer - NICHT die technische SharePoint-ID.
                                                Text: ="Patientennummer (fachlich)"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =20
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - txtStammNummer:
                                              Control: Classic/TextInput
                                              Properties:
                                                Default: =Coalesce(gblPatient.'Patienten ID', "")
                                                Reset: =gblFormularReset
                                                HintText: ="z. B. 2026-0142"
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =clrRahmen
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                PaddingLeft: =spM
                                                RadiusTopLeft: =radM
                                                RadiusTopRight: =radM
                                                RadiusBottomLeft: =radM
                                                RadiusBottomRight: =radM
                                                OnChange: =Set(gblUngespeichert, true)
                              - conAkteAktionen:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch + spS
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutJustifyContent: =LayoutJustifyContent.End
                                    LayoutGap: =spS
                                  Children:
                                    - lblAkteTechnisch:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            ="Technische ID: " & Coalesce(Text(gblPatient.ID), "-")
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          FillPortions: =1
                                          Height: =hTouch
                                          Wrap: =false
                                          PaddingLeft: =0
                                          VerticalAlign: =VerticalAlign.Middle
                                    - btnAkteSpeichern:
                                        Control: Classic/Button
                                        Properties:
                                          Text: =If(gblSpeichert, "Speichert ...", "Stammdaten speichern")
                                          # Doppelklickschutz: waehrend des Schreibens gesperrt.
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(gblSpeichert Or IsBlank(gblPatient), DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblPruefeAkte, true);
                                            If(
                                                IsBlank(Trim(txtStammVorname.Text)) Or IsBlank(Trim(txtStammNachname.Text)),
                                                Set(gblMeldung, "Bitte Vor- und Nachname ausfüllen.");
                                                Set(gblMeldungArt, "Warnung"),

                                                Set(gblSpeichert, true);
                                                Set(gblFehlerText, "");
                                                // Nur der Schreibvorgang selbst wird abgesichert,
                                                // nicht die ganze Befehlskette.
                                                Set(
                                                    gblSchreibErgebnis,
                                                    IfError(
                                                        Patch(
                                                            Patientenstamm,
                                                            gblPatient,
                                                            {
                                                                Vorname: Trim(txtStammVorname.Text),
                                                                Nachname: Trim(txtStammNachname.Text),
                                                                Geburtsdatum: dpStammGeburt.SelectedDate,
                                                                'Patienten ID': Trim(txtStammNummer.Text)
                                                            }
                                                        ),
                                                        Set(gblFehlerText, FirstError.Message); Blank()
                                                    )
                                                );
                                                // Ergebnis wird geprüft - nicht der Kettenabschluss.
                                                If(
                                                    IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                    Set(gblMeldung, "Speichern fehlgeschlagen. Ihre Eingaben bleiben erhalten. " & gblFehlerText);
                                                    Set(gblMeldungArt, "Fehler"),

                                                    Set(gblPatient, gblSchreibErgebnis);
                                                    Set(gblUngespeichert, false);
                                                    Set(gblPruefeAkte, false);
                                                    Set(gblMeldung, "Stammdaten gespeichert.");
                                                    Set(gblMeldungArt, "Erfolg")
                                                );
                                                Set(gblSpeichert, false)
                                            )
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          PressedFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          Height: =hTouch
                                          Width: =230
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                        # --- Karte: Verlauf ---------------------------
                        - conAkteVerlauf:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblPatient))
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =340
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblVerlaufTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Behandlungsverlauf"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblVerlaufLeer:
                                  Control: Label
                                  Properties:
                                    Visible: =CountRows(galVerlauf.AllItems) = 0
                                    Text: ="Zu diesem Patienten ist noch keine Behandlung dokumentiert."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - galVerlauf:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =Sort(
                                          Filter(Behandlungsdokumentation, PatientID = gblPatient.ID),
                                          ID,
                                          SortOrder.Descending
                                      )
                                    Layout: =Layout.Vertical
                                    TemplateSize: =66
                                    TemplatePadding: =0
                                    FillPortions: =1
                                    ShowScrollbar: =true
                                    DelayItemLoading: =true
                                  Children:
                                    - rectVerlaufZeile:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrFlaeche
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                          X: =0
                                          Y: =0
                                          OnSelect: =Select(Parent)
                                    - rectVerlaufTrenner:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrRahmen
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          OnSelect: =Select(Parent)
                                    - lblVerlaufDatum:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =If(IsBlank(ThisItem.Behandlungsdatum), "ohne Datum",
                                                Text(ThisItem.Behandlungsdatum, DateTimeFormat.ShortDate)) &
                                             "   |   " & Coalesce(ThisItem.Therapeut.Value, "Therapeut offen") &
                                             "   |   " & Coalesce(ThisItem.Terminstatus.Value, "ohne Terminstatus")
                                          Color: =clrText
                                          Size: =fsNormal
                                          X: =spS
                                          Y: =8
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblVerlaufText:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =Coalesce(ThisItem.Status.Value, "Entwurf") & " - " &
                                             Left(Coalesce(ThisItem.Massnahmen, "keine Maßnahmen erfasst"), 90)
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          X: =spS
                                          Y: =34
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =20
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - btnVerlaufOeffnen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Anzeigen"
                                          OnSelect: |-
                                            =Set(gblDoku, ThisItem);
                                            Set(gblDokuMassnahmenText, Blank());
                                            Set(gblRezept, LookUp(Rezepte, ID = ThisItem.RezeptID));
                                            Set(gblFormularReset, true); Set(gblFormularReset, false);
                                            Set(gblAnsicht, "Behandlung")
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrAkzent
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          Size: =fsKlein
                                          X: =Parent.TemplateWidth - 180
                                          Y: =11
                                          Width: =172
                                          Height: =hTouch
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: AUFNAHME (gefuehrter Ablauf in vier Schritten)
                  # Schritt 1 Patient -> 2 Rezept -> 3 Anamnese/Erstbefund
                  # -> 4 Zusammenfassung.
                  # Stammdaten und Rezept werden GETRENNT gespeichert und über
                  # die technische SharePoint-ID verbunden. Die Patienten-ID
                  # wird erst nach erfolgreichem Speichern verwendet.
                  # =====================================================
                  - conViewAufnahme:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Aufnahme"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - lblAufnTitel:
                            Control: Label
                            Properties:
                              Text: |-
                                ="Aufnahme - Schritt " & gblAufnahmeSchritt & " von 4: " &
                                 Switch(gblAufnahmeSchritt,
                                     1, "Patient",
                                     2, "Rezept",
                                     3, "Anamnese und Erstbefund",
                                     "Zusammenfassung")
                              Color: =clrText
                              Size: =fsTitel
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0

                        - conAufnFortschritt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =8
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spXS
                            Children:
                              - rectSchritt1:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =If(gblAufnahmeSchritt >= 1, clrAkzent, clrRahmen)
                                    FillPortions: =1
                                    Height: =8
                              - rectSchritt2:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =If(gblAufnahmeSchritt >= 2, clrAkzent, clrRahmen)
                                    FillPortions: =1
                                    Height: =8
                              - rectSchritt3:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =If(gblAufnahmeSchritt >= 3, clrAkzent, clrRahmen)
                                    FillPortions: =1
                                    Height: =8
                              - rectSchritt4:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =If(gblAufnahmeSchritt >= 4, clrAkzent, clrRahmen)
                                    FillPortions: =1
                                    Height: =8

                        # --- Schritt 1: Patient ------------------------
                        - conAufnSchritt1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =gblAufnahmeSchritt = 1
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =330
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAufnS1Hinweis:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      =If(
                                          IsBlank(gblPatient),
                                          "Neuen Patienten anlegen. Bereits bekannte Patienten bitte über den Bereich Patienten öffnen - dann wird hier nichts erneut abgefragt.",
                                          "Patient übernommen: " & Trim(Coalesce(gblPatient.Vorname, "") & " " & Coalesce(gblPatient.Nachname, "")) &
                                          ". Die Stammdaten werden nicht erneut abgefragt."
                                      )
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =40
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - txtAufnVorname:
                                  Control: Classic/TextInput
                                  Properties:
                                    Visible: =IsBlank(gblPatient)
                                    Default: =""
                                    Reset: =gblFormularReset
                                    HintText: ="Vorname *"
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeAufn1 And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtAufnNachname:
                                  Control: Classic/TextInput
                                  Properties:
                                    Visible: =IsBlank(gblPatient)
                                    Default: =""
                                    Reset: =gblFormularReset
                                    HintText: ="Nachname *"
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeAufn1 And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - dpAufnGeburt:
                                  Control: Classic/DatePicker
                                  Properties:
                                    Visible: =IsBlank(gblPatient)
                                    DefaultDate: =Blank()
                                    Reset: =gblFormularReset
                                    Format: =DateTimeFormat.ShortDate
                                    StartYear: =1920
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    OnChange: =Set(gblUngespeichert, true)
                              - btnAufnS1Weiter:
                                  Control: Classic/Button
                                  Properties:
                                    Text: |-
                                      =If(gblSpeichert, "Speichert ...",
                                          IsBlank(gblPatient), "Patient aufnehmen und weiter", "Weiter zum Rezept")
                                    DisplayMode: =If(gblSpeichert, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =If(
                                          // Bereits bekannter Patient: direkt weiter, nichts neu schreiben.
                                          Not(IsBlank(gblPatient)),
                                          Set(gblAufnahmeSchritt, 2); Set(gblMeldung, ""); Set(gblMeldungArt, ""),

                                          Set(gblPruefeAufn1, true);
                                          If(
                                              IsBlank(Trim(txtAufnVorname.Text)) Or IsBlank(Trim(txtAufnNachname.Text)),
                                              Set(gblMeldung, "Bitte Vor- und Nachname ausfüllen.");
                                              Set(gblMeldungArt, "Warnung"),

                                              Set(gblSpeichert, true);
                                              Set(gblFehlerText, "");
                                              Set(
                                                  gblSchreibErgebnis,
                                                  IfError(
                                                      Patch(
                                                          Patientenstamm,
                                                          Defaults(Patientenstamm),
                                                          {
                                                              Vorname: Trim(txtAufnVorname.Text),
                                                              Nachname: Trim(txtAufnNachname.Text),
                                                              Geburtsdatum: dpAufnGeburt.SelectedDate
                                                          }
                                                      ),
                                                      Set(gblFehlerText, FirstError.Message); Blank()
                                                  )
                                              );
                                              // Nur wenn wirklich eine ID zurueckkam, geht es weiter.
                                              If(
                                                  IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                  Set(gblMeldung, "Der Patient konnte nicht angelegt werden. Ihre Eingaben bleiben erhalten. " & gblFehlerText);
                                                  Set(gblMeldungArt, "Fehler"),

                                                  Set(gblPatient, gblSchreibErgebnis);
                                                  Set(gblPruefeAufn1, false);
                                                  Set(gblUngespeichert, false);
                                                  Set(gblAufnahmeSchritt, 2);
                                                  Set(gblMeldung, "Patient angelegt (ID " & gblSchreibErgebnis.ID & ").");
                                                  Set(gblMeldungArt, "Erfolg")
                                              );
                                              Set(gblSpeichert, false)
                                          )
                                      )
                                    Fill: =clrAkzent
                                    Color: =clrFlaecheWeiss
                                    HoverFill: =clrAkzentDunkel
                                    PressedFill: =clrAkzentDunkel
                                    DisabledFill: =clrRahmen
                                    DisabledColor: =clrTextLeise
                                    BorderThickness: =0
                                    Size: =fsNormal
                                    FontWeight: =FontWeight.Semibold
                                    Height: =hTouch
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                        # --- Schritt 2: Rezept ------------------------
                        - conAufnSchritt2:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =gblAufnahmeSchritt = 2
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =430
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAufnS2Titel:
                                  Control: Label
                                  Properties:
                                    Text: ="Rezeptdaten"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - txtAufnDiagnose:
                                  Control: Classic/TextInput
                                  Properties:
                                    # Anzeigename "Diagnose laut Rezept", intern DiagnoselautRezept.
                                    # Es wird bewusst KEIN zweites Feld "Diagnose" angelegt.
                                    Default: =Coalesce(gblRezept.'Diagnose laut Rezept', "")
                                    Reset: =gblFormularReset
                                    HintText: ="Diagnose laut Rezept *"
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeAufn2 And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - conAufnZeile2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hEingabe
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutWrap: =true
                                    LayoutGap: =spS
                                  Children:
                                    - txtAufnEinheiten:
                                        Control: Classic/TextInput
                                        Properties:
                                          # Anzeigename der Rezeptmenge ist "Behandlungseinheiten".
                                          # Kein Feld "EinheitenSoll" anlegen.
                                          Default: =Coalesce(Text(gblRezept.Behandlungseinheiten), "")
                                          Reset: =gblFormularReset
                                          HintText: ="Behandlungseinheiten *"
                                          Format: =TextFormat.Number
                                          Height: =hEingabe
                                          FillPortions: =1
                                          BorderColor: =If(gblPruefeAufn2 And Not(Value(Self.Text) > 0), clrFehler, clrRahmen)
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          PaddingLeft: =spM
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                          OnChange: =Set(gblUngespeichert, true)
                                    - txtAufnFrequenz:
                                        Control: Classic/TextInput
                                        Properties:
                                          Default: =Coalesce(gblRezept.Frequenz, "")
                                          Reset: =gblFormularReset
                                          HintText: ="Frequenz, z. B. 2x pro Woche"
                                          Height: =hEingabe
                                          FillPortions: =1
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          PaddingLeft: =spM
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                          OnChange: =Set(gblUngespeichert, true)
                              - txtAufnVerordner:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblRezept.Verordner, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Verordner (Arztpraxis)"
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtAufnAltEinheiten:
                                  Control: Classic/TextInput
                                  Properties:
                                    # Bereits außerhalb der App erbrachte Einheiten dieses Rezepts.
                                    # Das ist NICHT die Behandlungsmenge einer einzelnen Doku-Zeile.
                                    Default: =Coalesce(Text(gblRezept.AltEinheiten), "0")
                                    Reset: =gblFormularReset
                                    HintText: ="Bereits außerhalb der App erbrachte Einheiten"
                                    Format: =TextFormat.Number
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - conAufnS2Aktionen:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =spS
                                  Children:
                                    - btnAufnS2Zurueck:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Zurück"
                                          OnSelect: =Set(gblAufnahmeSchritt, 1)
                                          Fill: =clrFlaeche
                                          Color: =clrText
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          Height: =hTouch
                                          Width: =140
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                    - btnAufnS2Weiter:
                                        Control: Classic/Button
                                        Properties:
                                          Text: =If(gblSpeichert, "Speichert ...", "Rezept als Entwurf sichern und weiter")
                                          DisplayMode: =If(gblSpeichert, DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblPruefeAufn2, true);
                                            If(
                                                IsBlank(Trim(txtAufnDiagnose.Text)) Or Not(Value(txtAufnEinheiten.Text) > 0),
                                                Set(gblMeldung, "Bitte Diagnose laut Rezept und eine Anzahl Behandlungseinheiten größer 0 angeben.");
                                                Set(gblMeldungArt, "Warnung"),

                                                Set(gblSpeichert, true);
                                                Set(gblFehlerText, "");
                                                Set(
                                                    gblSchreibErgebnis,
                                                    IfError(
                                                        Patch(
                                                            Rezepte,
                                                            // Vorhandenen Entwurf weiterfuehren statt doppelt anzulegen.
                                                            If(IsBlank(gblRezept), Defaults(Rezepte), gblRezept),
                                                            {
                                                                PatientID: gblPatient.ID,
                                                                'Diagnose laut Rezept': Trim(txtAufnDiagnose.Text),
                                                                Behandlungseinheiten: Value(txtAufnEinheiten.Text),
                                                                Frequenz: Trim(txtAufnFrequenz.Text),
                                                                Verordner: Trim(txtAufnVerordner.Text),
                                                                AltEinheiten: Coalesce(Value(txtAufnAltEinheiten.Text), 0),
                                                                Rezeptstatus: { Value: "Entwurf" }
                                                            }
                                                        ),
                                                        Set(gblFehlerText, FirstError.Message); Blank()
                                                    )
                                                );
                                                If(
                                                    IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                    Set(gblMeldung, "Das Rezept konnte nicht gesichert werden. Ihre Eingaben bleiben erhalten. " & gblFehlerText);
                                                    Set(gblMeldungArt, "Fehler"),

                                                    Set(gblRezept, gblSchreibErgebnis);
                                                    Set(gblPruefeAufn2, false);
                                                    Set(gblUngespeichert, false);
                                                    Set(gblAufnahmeSchritt, 3);
                                                    Set(gblMeldung, "Rezeptentwurf gesichert. Die Aufnahme kann jederzeit hier fortgesetzt werden.");
                                                    Set(gblMeldungArt, "Erfolg")
                                                );
                                                Set(gblSpeichert, false)
                                            )
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          PressedFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          Height: =hTouch
                                          FillPortions: =1
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                        # --- Schritt 3: Anamnese und Erstbefund -------
                        - conAufnSchritt3:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =gblAufnahmeSchritt = 3
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =520
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAufnS3Titel:
                                  Control: Label
                                  Properties:
                                    Text: ="Anamnese und Erstbefund"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblAufnS3Hinweis:
                                  Control: Label
                                  Properties:
                                    Text: ="Diese Angaben gehören zum Rezept und werden später in der Behandlungsdokumentation nur gelesen, nicht kopiert."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - txtAufnBeschwerden:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblRezept.Beschwerden, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Beschwerden"
                                    Mode: =TextMode.MultiLine
                                    Height: =84
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtAufnAnamnese:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblRezept.Anamnese, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Anamnese"
                                    Mode: =TextMode.MultiLine
                                    Height: =84
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtAufnErstbefund:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblRezept.Erstbefund, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Erstbefund"
                                    Mode: =TextMode.MultiLine
                                    Height: =84
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtAufnZiele:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblRezept.Therapieziele, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Therapieziele"
                                    Mode: =TextMode.MultiLine
                                    Height: =84
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    OnChange: =Set(gblUngespeichert, true)
                              - conAufnS3Aktionen:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =spS
                                  Children:
                                    - btnAufnS3Zurueck:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Zurück"
                                          OnSelect: =Set(gblAufnahmeSchritt, 2)
                                          Fill: =clrFlaeche
                                          Color: =clrText
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          Height: =hTouch
                                          Width: =140
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                    - btnAufnS3Weiter:
                                        Control: Classic/Button
                                        Properties:
                                          Text: =If(gblSpeichert, "Speichert ...", "Entwurf speichern und weiter")
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(gblSpeichert Or IsBlank(gblRezept), DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblSpeichert, true);
                                            Set(gblFehlerText, "");
                                            Set(
                                                gblSchreibErgebnis,
                                                IfError(
                                                    Patch(
                                                        Rezepte,
                                                        gblRezept,
                                                        {
                                                            Beschwerden: txtAufnBeschwerden.Text,
                                                            Anamnese: txtAufnAnamnese.Text,
                                                            Erstbefund: txtAufnErstbefund.Text,
                                                            Therapieziele: txtAufnZiele.Text
                                                        }
                                                    ),
                                                    Set(gblFehlerText, FirstError.Message); Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                Set(gblMeldung, "Speichern fehlgeschlagen. Ihre Eingaben bleiben erhalten. " & gblFehlerText);
                                                Set(gblMeldungArt, "Fehler"),

                                                Set(gblRezept, gblSchreibErgebnis);
                                                Set(gblUngespeichert, false);
                                                Set(gblAufnahmeSchritt, 4);
                                                Set(gblMeldung, ""); Set(gblMeldungArt, "")
                                            );
                                            Set(gblSpeichert, false)
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          PressedFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          Height: =hTouch
                                          FillPortions: =1
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                        # --- Schritt 4: Zusammenfassung ---------------
                        - conAufnSchritt4:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =gblAufnahmeSchritt = 4
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =420
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAufnS4Titel:
                                  Control: Label
                                  Properties:
                                    Text: ="Zusammenfassung"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblAufnS4Text:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      ="Patient: " & Trim(Coalesce(gblPatient.Vorname, "") & " " & Coalesce(gblPatient.Nachname, "")) &
                                       "  (technische ID " & Coalesce(Text(gblPatient.ID), "-") & ")" & Char(10) &
                                       "Rezept: " & Coalesce(Text(gblRezept.ID), "-") &
                                       "  |  Diagnose laut Rezept: " & Coalesce(gblRezept.'Diagnose laut Rezept', "-") & Char(10) &
                                       "Behandlungseinheiten: " & Coalesce(Text(gblRezept.Behandlungseinheiten), "-") &
                                       "  |  bereits außerhalb der App erbracht: " & Coalesce(Text(gblRezept.AltEinheiten), "0") & Char(10) &
                                       "Frequenz: " & Coalesce(gblRezept.Frequenz, "-") &
                                       "  |  Verordner: " & Coalesce(gblRezept.Verordner, "-")
                                    Color: =clrText
                                    Size: =fsNormal
                                    Height: =130
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - lblAufnS4Anlagen:
                                  Control: Label
                                  Properties:
                                    # Ehrlicher Stand: Anlagen/Rezeptfoto sind ein eigenes Modul.
                                    # Siehe 05_Flows/Einrichtung.md, Abschnitt "Rezeptfoto".
                                    Text: |-
                                      ="Rezeptfoto und Anlagen: noch nicht eingerichtet. Der Ablauf dafür ist in 05_Flows beschrieben und wird als eigener Schritt ergänzt."
                                    Color: =clrWarnung
                                    Fill: =clrWarnungSanft
                                    Size: =fsKlein
                                    Height: =44
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =spS
                                    PaddingRight: =spS
                                    VerticalAlign: =VerticalAlign.Middle
                              - conAufnS4Aktionen:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =spS
                                  Children:
                                    - btnAufnS4Zurueck:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Zurück"
                                          OnSelect: =Set(gblAufnahmeSchritt, 3)
                                          Fill: =clrFlaeche
                                          Color: =clrText
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          Height: =hTouch
                                          Width: =140
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                    - btnAufnAbschliessen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: =If(gblSpeichert, "Speichert ...", "Aufnahme abschließen")
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(gblSpeichert Or IsBlank(gblRezept), DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblSpeichert, true);
                                            Set(gblFehlerText, "");
                                            Set(
                                                gblSchreibErgebnis,
                                                IfError(
                                                    Patch(Rezepte, gblRezept, { Rezeptstatus: { Value: "Aktiv" } }),
                                                    Set(gblFehlerText, FirstError.Message); Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                Set(gblMeldung, "Das Rezept konnte nicht aktiviert werden. " & gblFehlerText);
                                                Set(gblMeldungArt, "Fehler"),

                                                Set(gblRezept, gblSchreibErgebnis);
                                                Set(gblUngespeichert, false);
                                                Set(gblAufnahmeSchritt, 1);
                                                Set(gblAnsicht, "Rezepte");
                                                Set(gblMeldung, "Aufnahme abgeschlossen. Das Rezept ist aktiv.");
                                                Set(gblMeldungArt, "Erfolg")
                                            );
                                            Set(gblSpeichert, false)
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          PressedFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          Height: =hTouch
                                          FillPortions: =1
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: REZEPTE (mehrere Rezepte je Patient)
                  # =====================================================
                  - conViewRezepte:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Rezepte"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =If(conPraxisApp.Width >= bpBreit, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        # --- Liste der Rezepte ------------------------
                        - conRezListe:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =1
                              Height: =If(conPraxisApp.Width >= bpBreit, conViewRezepte.Height - 2 * spL, 320)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblRezListeTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Rezepte"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblRezListeLeer:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      =If(
                                          IsBlank(gblPatient),
                                          "Kein Patient ausgewählt.",
                                          CountRows(galRezepte.AllItems) = 0,
                                          "Zu diesem Patienten ist noch kein Rezept erfasst. Über den Bereich Aufnahme kann eines angelegt werden.",
                                          ""
                                      )
                                    Visible: |-
                                      =IsBlank(gblPatient) Or CountRows(galRezepte.AllItems) = 0
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =40
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - galRezepte:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =Sort(
                                          Filter(Rezepte, PatientID = gblPatient.ID),
                                          ID,
                                          SortOrder.Descending
                                      )
                                    Layout: =Layout.Vertical
                                    TemplateSize: =86
                                    TemplatePadding: =0
                                    FillPortions: =1
                                    ShowScrollbar: =true
                                    DelayItemLoading: =true
                                  Children:
                                    - rectRezZeile:
                                        Control: Rectangle
                                        Properties:
                                          Fill: |-
                                            =If(ThisItem.ID = gblRezept.ID, clrAkzentSanft, clrFlaeche)
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                          X: =0
                                          Y: =0
                                          OnSelect: =Select(Parent)
                                    - rectRezTrenner:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrRahmen
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          OnSelect: =Select(Parent)
                                    - lblRezDiagnose:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            ="Rezept " & ThisItem.ID & " - " &
                                             Coalesce(ThisItem.'Diagnose laut Rezept', "ohne Diagnose")
                                          Color: =clrText
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          X: =spS
                                          Y: =10
                                          Width: =Parent.TemplateWidth - 2 * spS
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblRezStand:
                                        Control: Label
                                        Properties:
                                          # Fehlende Berechnung wird als solche benannt, nicht als "0 offen".
                                          Text: |-
                                            =If(
                                                IsBlank(ThisItem.ZaehlerStand),
                                                "Einheiten noch nicht berechnet",
                                                Coalesce(ThisItem.Offen, 0) & " von " &
                                                Coalesce(ThisItem.Behandlungseinheiten, 0) & " Einheiten offen"
                                            )
                                          Color: =If(IsBlank(ThisItem.ZaehlerStand), clrWarnung, clrTextLeise)
                                          Size: =fsKlein
                                          X: =spS
                                          Y: =36
                                          Width: =Parent.TemplateWidth - 2 * spS
                                          Height: =20
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblRezStatus:
                                        Control: Label
                                        Properties:
                                          Text: =Coalesce(ThisItem.Rezeptstatus.Value, "ohne Status")
                                          Color: |-
                                            =Switch(Coalesce(ThisItem.Rezeptstatus.Value, ""),
                                                "Aktiv", clrErfolg,
                                                "Pausiert", clrWarnung,
                                                "Abgeschlossen", clrTextLeise,
                                                "Abgebrochen", clrFehler,
                                                clrWarnung)
                                          Fill: |-
                                            =Switch(Coalesce(ThisItem.Rezeptstatus.Value, ""),
                                                "Aktiv", clrErfolgSanft,
                                                "Pausiert", clrWarnungSanft,
                                                "Abgeschlossen", clrHintergrund,
                                                "Abgebrochen", clrFehlerSanft,
                                                clrWarnungSanft)
                                          Size: =fsKlein
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          X: =spS
                                          Y: =58
                                          Width: =150
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          OnSelect: =Select(Parent)
                                    - btnRezWaehlen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Auswählen"
                                          OnSelect: |-
                                            =Set(gblRezept, ThisItem);
                                            Set(gblDoku, Blank());
                                            Set(gblFormularReset, true); Set(gblFormularReset, false);
                                            Set(gblMeldung, ""); Set(gblMeldungArt, "")
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrAkzent
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          Size: =fsKlein
                                          X: =Parent.TemplateWidth - 160
                                          Y: =50
                                          Width: =152
                                          Height: =hTouch
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                        # --- Einzelnes Rezept -------------------------
                        - conRezDetail:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =1
                              Height: =If(conPraxisApp.Width >= bpBreit, conViewRezepte.Height - 2 * spL, 520)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblRezDetailLeer:
                                  Control: Label
                                  Properties:
                                    Visible: =IsBlank(gblRezept)
                                    Text: ="Bitte links ein Rezept auswählen."
                                    Color: =clrTextLeise
                                    Size: =fsNormal
                                    Height: =40
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - lblRezDetailTitel:
                                  Control: Label
                                  Properties:
                                    Visible: =Not(IsBlank(gblRezept))
                                    Text: |-
                                      ="Rezept " & Coalesce(Text(gblRezept.ID), "-")
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblRezDetailText:
                                  Control: Label
                                  Properties:
                                    Visible: =Not(IsBlank(gblRezept))
                                    # Die Aufnahmeinformationen werden direkt aus DIESEM Rezept
                                    # gelesen. Es gibt keine zweite Diagnosekopie.
                                    Text: |-
                                      ="Diagnose laut Rezept" & Char(10) & Coalesce(gblRezept.'Diagnose laut Rezept', "-") & Char(10) & Char(10) &
                                       "Aufnahmebefund (Erstbefund)" & Char(10) & Coalesce(gblRezept.Erstbefund, "-") & Char(10) & Char(10) &
                                       "Vereinbarte Therapieziele" & Char(10) & Coalesce(gblRezept.Therapieziele, "-") & Char(10) & Char(10) &
                                       "Beschwerden" & Char(10) & Coalesce(gblRezept.Beschwerden, "-") & Char(10) & Char(10) &
                                       "Anamnese" & Char(10) & Coalesce(gblRezept.Anamnese, "-")
                                    Color: =clrText
                                    Size: =fsNormal
                                    Height: =420
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - lblRezDetailEinheiten:
                                  Control: Label
                                  Properties:
                                    Visible: =Not(IsBlank(gblRezept))
                                    Text: |-
                                      =If(
                                          IsBlank(gblRezept.ZaehlerStand),
                                          "Einheiten: " & Coalesce(Text(gblRezept.Behandlungseinheiten), "-") &
                                          " verordnet. Erbrachte und offene Einheiten sind noch nicht berechnet.",
                                          "Verordnet " & Coalesce(Text(gblRezept.Behandlungseinheiten), "-") &
                                          "  |  außerhalb der App erbracht " & Coalesce(Text(gblRezept.AltEinheiten), "0") &
                                          "  |  in der App dokumentiert " & Coalesce(Text(gblRezept.EinheitenApp), "0") &
                                          "  |  offen " & Coalesce(Text(gblRezept.Offen), "0")
                                      )
                                    Color: =If(IsBlank(gblRezept.ZaehlerStand), clrWarnung, clrText)
                                    Fill: =If(IsBlank(gblRezept.ZaehlerStand), clrWarnungSanft, clrHintergrund)
                                    Size: =fsKlein
                                    Height: =56
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =spS
                                    PaddingRight: =spS
                                    VerticalAlign: =VerticalAlign.Middle
                              - conRezAktionen:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =Not(IsBlank(gblRezept))
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutWrap: =true
                                    LayoutGap: =spS
                                  Children:
                                    - btnRezBehandlung:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Behandlung starten"
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(
                                                Coalesce(gblRezept.Rezeptstatus.Value, "") in ["Abgeschlossen", "Abgebrochen"],
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          OnSelect: |-
                                            =Set(gblDoku, Blank());
                                            Set(gblFormularReset, true); Set(gblFormularReset, false);
                                            Set(gblUngespeichert, false);
                                            Set(gblMeldung, ""); Set(gblMeldungArt, "");
                                            Set(gblAnsicht, "Behandlung")
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          Height: =hTouch
                                          Width: =210
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                    - drpRezStatus:
                                        Control: Classic/DropDown
                                        Properties:
                                          Items: |-
                                            =["Entwurf", "Aktiv", "Pausiert", "Abgeschlossen", "Abgebrochen"]
                                          Default: =Coalesce(gblRezept.Rezeptstatus.Value, "Entwurf")
                                          Reset: =gblFormularReset
                                          Height: =hTouch
                                          Width: =200
                                          FillPortions: =0
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                    - btnRezStatusSpeichern:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Status übernehmen"
                                          DisplayMode: =If(gblSpeichert, DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblSpeichert, true);
                                            Set(gblFehlerText, "");
                                            Set(
                                                gblSchreibErgebnis,
                                                IfError(
                                                    // Gezielt nur das Statusfeld schreiben, damit gleichzeitige
                                                    // Änderungen an der Diagnose nicht überschrieben werden.
                                                    Patch(Rezepte, gblRezept, { Rezeptstatus: { Value: drpRezStatus.Selected.Value } }),
                                                    Set(gblFehlerText, FirstError.Message); Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                Set(gblMeldung, "Der Rezeptstatus konnte nicht gespeichert werden. " & gblFehlerText);
                                                Set(gblMeldungArt, "Fehler"),

                                                Set(gblRezept, gblSchreibErgebnis);
                                                Set(gblMeldung, "Rezeptstatus gespeichert.");
                                                Set(gblMeldungArt, "Erfolg")
                                            );
                                            Set(gblSpeichert, false)
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrAkzent
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          Size: =fsNormal
                                          Height: =hTouch
                                          Width: =210
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: BEHANDLUNG (Dokumentation)
                  # Freigegebene Einträge werden im normalen Ablauf NICHT
                  # überschrieben. Eine Korrektur entsteht als neuer,
                  # nachvollziehbar verknuepfter Eintrag.
                  # =====================================================
                  - conViewDoku:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Behandlung"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - lblDokuLeer:
                            Control: Label
                            Properties:
                              Visible: =IsBlank(gblPatient) Or IsBlank(gblRezept)
                              Text: ="Für eine Dokumentation werden ein Patient und ein Rezept benötigt. Bitte zuerst im Bereich Rezepte ein Rezept auswählen."
                              Color: =clrTextLeise
                              Size: =fsNormal
                              Height: =60
                              FillPortions: =0
                              Wrap: =true
                              PaddingLeft: =0

                        # --- Hinweis bei freigegebenem Eintrag ---------
                        - conDokuGesperrt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: |-
                                =Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben"
                              Fill: =clrErfolgSanft
                              FillPortions: =0
                              Height: =64
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =spS
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              RadiusTopLeft: =radM
                              RadiusTopRight: =radM
                              RadiusBottomLeft: =radM
                              RadiusBottomRight: =radM
                            Children:
                              - lblDokuGesperrt:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      ="Dieser Eintrag ist freigegeben" &
                                       If(IsBlank(gblDoku.'Freigegeben am'), "",
                                          " am " & Text(gblDoku.'Freigegeben am', DateTimeFormat.ShortDate)) &
                                       " und wird nicht mehr verändert. Für eine Änderung bitte eine Korrektur erfassen."
                                    Color: =clrErfolg
                                    Size: =fsNormal
                                    FillPortions: =1
                                    Height: =48
                                    Wrap: =true
                                    PaddingLeft: =0
                                    VerticalAlign: =VerticalAlign.Middle
                              - btnDokuKorrektur:
                                  Control: Classic/Button
                                  Properties:
                                    Text: ="Korrektur erfassen"
                                    OnSelect: |-
                                      =Set(gblKorrekturZu, gblDoku.ID);
                                      Set(gblDoku, Blank());
                                      Set(gblFormularReset, true); Set(gblFormularReset, false);
                                      Set(gblMeldung, "Korrektur zu Eintrag " & gblKorrekturZu & ". Der ursprüngliche Eintrag bleibt unverändert erhalten.");
                                      Set(gblMeldungArt, "Warnung")
                                    Fill: =clrFlaeche
                                    Color: =clrAkzent
                                    BorderColor: =clrAkzent
                                    BorderThickness: =1
                                    Size: =fsKlein
                                    Height: =hTouch
                                    Width: =200
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                        # --- Kopfdaten der Behandlung ------------------
                        - conDokuKopf:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblPatient)) And Not(IsBlank(gblRezept))
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =220
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblDokuKopfTitel:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      =If(gblKorrekturZu > 0,
                                          "Korrektur zu Eintrag " & gblKorrekturZu,
                                          IsBlank(gblDoku), "Neue Behandlung",
                                          "Behandlung " & gblDoku.ID & " bearbeiten")
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - conDokuKopfZeile:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =74
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutWrap: =true
                                    LayoutGap: =spM
                                  Children:
                                    - conDokuDatum:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =240
                                          Height: =74
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblDokuDatum:
                                              Control: Label
                                              Properties:
                                                Text: ="Behandlungsdatum"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =18
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - dpDokuDatum:
                                              Control: Classic/DatePicker
                                              Properties:
                                                # Sinnvoll vorbelegt mit heute, aber aenderbar.
                                                DefaultDate: =Coalesce(gblDoku.Behandlungsdatum, Today())
                                                Reset: =gblFormularReset
                                                Format: =DateTimeFormat.ShortDate
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =clrRahmen
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                DisplayMode: |-
                                                  =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                                OnChange: =Set(gblUngespeichert, true)
                                    - conDokuTherapeut:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =240
                                          Height: =74
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblDokuTherapeut:
                                              Control: Label
                                              Properties:
                                                Text: ="Behandelnder Physio"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =18
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - drpDokuTherapeut:
                                              Control: Classic/DropDown
                                              Properties:
                                                # "Therapeut" ist ein Auswahlfeld (Choice), KEIN
                                                # Microsoft-365-Personenfeld. Deshalb gibt es hier
                                                # bewusst keinen Zugriff auf .Email oder .DisplayName
                                                # und keine Ableitung aus dem angemeldeten Benutzer.
                                                Items: =Choices(Behandlungsdokumentation.Therapeut)
                                                Default: =Coalesce(gblDoku.Therapeut.Value, gblTherapeutVorauswahl)
                                                Reset: =gblFormularReset
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =If(gblPruefeDoku And IsBlank(Self.Selected.Value), clrFehler, clrRahmen)
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                DisplayMode: |-
                                                  =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                                OnChange: =Set(gblUngespeichert, true)
                                    - conDokuTermin:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =0
                                          Width: =240
                                          Height: =74
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =spXS
                                        Children:
                                          - lblDokuTermin:
                                              Control: Label
                                              Properties:
                                                Text: ="Terminstatus"
                                                Color: =clrTextLeise
                                                Size: =fsKlein
                                                Height: =18
                                                FillPortions: =0
                                                Wrap: =false
                                                PaddingLeft: =0
                                          - drpDokuTermin:
                                              Control: Classic/DropDown
                                              Properties:
                                                # Nur "Durchgeführt" verbraucht später Einheiten.
                                                # Gezaehlt wird ausschliesslich im Flow, nicht hier.
                                                Items: =Choices(Behandlungsdokumentation.Terminstatus)
                                                Default: =Coalesce(gblDoku.Terminstatus.Value, "Durchgeführt")
                                                Reset: =gblFormularReset
                                                Height: =hEingabe
                                                FillPortions: =0
                                                BorderColor: =clrRahmen
                                                BorderThickness: =1
                                                Size: =fsNormal
                                                DisplayMode: |-
                                                  =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                                OnChange: =Set(gblUngespeichert, true)
                              - conDokuMenge:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hEingabe
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =spM
                                  Children:
                                    - chkDokuAbweichend:
                                        Control: Classic/CheckBox
                                        Properties:
                                          # Standard ist eine Einheit. Abweichungen müssen
                                          # ausdruecklich erfasst werden.
                                          Text: ="Abweichende Behandlungsmenge"
                                          Default: =Coalesce(gblDoku.AltEinheiten, 1) <> 1
                                          Reset: =gblFormularReset
                                          Height: =hTouch
                                          Width: =300
                                          FillPortions: =0
                                          Size: =fsNormal
                                          Color: =clrText
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                          OnCheck: =Set(gblUngespeichert, true)
                                          OnUncheck: =Set(gblUngespeichert, true)
                                    - txtDokuMenge:
                                        Control: Classic/TextInput
                                        Properties:
                                          Visible: =chkDokuAbweichend.Value
                                          Default: =Text(Coalesce(gblDoku.AltEinheiten, 1))
                                          Reset: =gblFormularReset
                                          HintText: ="Anzahl Einheiten"
                                          Format: =TextFormat.Number
                                          Height: =hEingabe
                                          Width: =180
                                          FillPortions: =0
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsNormal
                                          PaddingLeft: =spM
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                          OnChange: =Set(gblUngespeichert, true)
                                    - lblDokuMengeHinweis:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =If(chkDokuAbweichend.Value,
                                                "Es werden " & Coalesce(Text(Value(txtDokuMenge.Text)), "?") & " Einheiten erfasst.",
                                                "Es wird 1 Einheit erfasst.")
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          FillPortions: =1
                                          Height: =hTouch
                                          Wrap: =false
                                          PaddingLeft: =0
                                          VerticalAlign: =VerticalAlign.Middle

                        # --- Vorherige Dokumentation (nur lesend) ------
                        - conDokuVorherig:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblRezept)) And gblZeigeVorherige
                              Fill: =clrHintergrund
                              FillPortions: =0
                              Height: =180
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblDokuVorherigTitel:
                                  Control: Label
                                  Properties:
                                    # Bewusst nur zum Nachlesen. Der Text wird NICHT automatisch
                                    # als aktueller Befund übernommen.
                                    Text: ="Letzte durchgeführte Behandlung zu diesem Rezept (nur zum Nachlesen)"
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - lblDokuVorherigText:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      =With(
                                          { v: First(Sort(
                                                  Filter(Behandlungsdokumentation,
                                                      RezeptID = gblRezept.ID,
                                                      Terminstatus.Value = "Durchgeführt"),
                                                  ID, SortOrder.Descending)) },
                                          If(
                                              IsBlank(v),
                                              "Es liegt noch keine durchgeführte Behandlung zu diesem Rezept vor.",
                                              Text(v.Behandlungsdatum, DateTimeFormat.ShortDate) & Char(10) &
                                              "Situation: " & Coalesce(v.Situation, "-") & Char(10) &
                                              "Maßnahmen: " & Coalesce(v.Massnahmen, "-") & Char(10) &
                                              "Reaktion: " & Coalesce(v.Reaktion, "-")
                                          )
                                      )
                                    Color: =clrText
                                    Size: =fsKlein
                                    Height: =120
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0

                        # --- Inhalt der Dokumentation -----------------
                        - conDokuInhalt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblPatient)) And Not(IsBlank(gblRezept))
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =640
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - conDokuWerkzeuge:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =0
                                    Height: =hTouch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutWrap: =true
                                    LayoutGap: =spS
                                  Children:
                                    - btnDokuVorherige:
                                        Control: Classic/Button
                                        Properties:
                                          Text: |-
                                            =If(gblZeigeVorherige, "Letzte Behandlung ausblenden", "Letzte Behandlung einblenden")
                                          OnSelect: =Set(gblZeigeVorherige, Not(gblZeigeVorherige))
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          Size: =fsKlein
                                          Height: =hTouch
                                          Width: =260
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                    - drpDokuBaustein:
                                        Control: Classic/DropDown
                                        Properties:
                                          # Textbausteine stammen aus der Einstellungsliste.
                                          # Es werden bewusst KEINE fachlichen Inhalte mitgeliefert.
                                          Items: |-
                                            =Sort(Filter(AufgabenEinstellungen, Typart.Value = "Textbaustein"), ID, SortOrder.Ascending)
                                          Value: ="Beschreibung"
                                          Reset: =gblFormularReset
                                          Height: =hTouch
                                          Width: =300
                                          FillPortions: =1
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          Size: =fsKlein
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.Disabled, DisplayMode.Edit)
                                    - btnDokuBausteinEinfuegen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Baustein in Maßnahmen einfügen"
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(
                                                Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben"
                                                    Or IsBlank(drpDokuBaustein.Selected.Beschreibung),
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          OnSelect: |-
                                            =Set(
                                                gblDokuMassnahmenText,
                                                If(Len(txtDokuMassnahmen.Text) = 0,
                                                   drpDokuBaustein.Selected.Beschreibung,
                                                   txtDokuMassnahmen.Text & Char(10) & drpDokuBaustein.Selected.Beschreibung)
                                            );
                                            Set(gblResetMassnahmen, true); Set(gblResetMassnahmen, false);
                                            Set(gblUngespeichert, true)
                                          Fill: =clrFlaeche
                                          Color: =clrAkzent
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          HoverFill: =clrAkzentSanft
                                          DisabledFill: =clrHintergrund
                                          DisabledColor: =clrTextLeise
                                          Size: =fsKlein
                                          Height: =hTouch
                                          Width: =290
                                          FillPortions: =0
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                              - lblDokuBausteinLeer:
                                  Control: Label
                                  Properties:
                                    Visible: |-
                                      =CountRows(Filter(AufgabenEinstellungen, Typart.Value = "Textbaustein")) = 0
                                    Text: ="Es sind noch keine Textbausteine hinterlegt. Diese können im Bereich Einstellungen gepflegt werden."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =18
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - txtDokuSituation:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblDoku.Situation, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Situation / Befund heute *"
                                    Mode: =TextMode.MultiLine
                                    Height: =96
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeDoku And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtDokuMassnahmen:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblDokuMassnahmenText, gblDoku.Massnahmen, "")
                                    Reset: =gblFormularReset Or gblResetMassnahmen
                                    HintText: ="Maßnahmen *"
                                    Mode: =TextMode.MultiLine
                                    Height: =96
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeDoku And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtDokuReaktion:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Coalesce(gblDoku.Reaktion, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Reaktion / Ergebnis *"
                                    Mode: =TextMode.MultiLine
                                    Height: =96
                                    FillPortions: =0
                                    BorderColor: =If(gblPruefeDoku And IsBlank(Trim(Self.Text)), clrFehler, clrRahmen)
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                    OnChange: =Set(gblUngespeichert, true)
                              - btnDokuMehr:
                                  Control: Classic/Button
                                  Properties:
                                    # Seltener benoetigte Angaben sind eingeklappt.
                                    Text: |-
                                      =If(gblDokuMehr, "Weitere Angaben ausblenden", "Weitere Angaben (Heimübungen, weiteres Vorgehen)")
                                    OnSelect: =Set(gblDokuMehr, Not(gblDokuMehr))
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Color: =clrAkzent
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    HoverFill: =clrAkzentSanft
                                    Size: =fsKlein
                                    Align: =Align.Left
                                    Height: =hTouch
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - txtDokuHeim:
                                  Control: Classic/TextInput
                                  Properties:
                                    Visible: =gblDokuMehr
                                    Default: =Coalesce(gblDoku.Heimuebungen, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Heimübungen"
                                    Mode: =TextMode.MultiLine
                                    Height: =80
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                    OnChange: =Set(gblUngespeichert, true)
                              - txtDokuVorgehen:
                                  Control: Classic/TextInput
                                  Properties:
                                    Visible: =gblDokuMehr
                                    Default: =Coalesce(gblDoku.WeiteresVorgehen, "")
                                    Reset: =gblFormularReset
                                    HintText: ="Weiteres Vorgehen"
                                    Mode: =TextMode.MultiLine
                                    Height: =80
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                    OnChange: =Set(gblUngespeichert, true)
                              - lblDokuExport:
                                  Control: Label
                                  Properties:
                                    # Der Dokumentenlink wird vom bestehenden Exportprozess
                                    # gesetzt. Die App schreibt ihn NICHT, um vorhandene
                                    # Ablaeufe nicht zu doppeln.
                                    Visible: =Not(IsBlank(gblDoku.Dokumentenlink))
                                    Text: |-
                                      ="Abgelegtes Dokument vorhanden (vom bestehenden Exportprozess gesetzt)."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0

                        # --- Aktionen: Entwurf, Prüfung, Freigabe -----
                        - conDokuAktionen:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Visible: =Not(IsBlank(gblPatient)) And Not(IsBlank(gblRezept))
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =If(conPraxisApp.Width >= bpBreit, hTouch + 2 * spM, 2 * hTouch + 3 * spM)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutWrap: =true
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblDokuStatus:
                                  Control: Label
                                  Properties:
                                    Text: |-
                                      ="Status: " & Coalesce(gblDoku.Status.Value, "Entwurf (noch nicht gespeichert)")
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    FillPortions: =1
                                    Height: =hTouch
                                    Wrap: =false
                                    PaddingLeft: =0
                                    VerticalAlign: =VerticalAlign.Middle

                              - btnDokuEntwurf:
                                  Control: Classic/Button
                                  Properties:
                                    Text: =If(gblSpeichert, "Speichert ...", "Entwurf speichern")
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(
                                          gblSpeichert Or Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben",
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    OnSelect: |-
                                      =Set(gblPruefeDoku, true);
                                      If(
                                          IsBlank(Trim(txtDokuSituation.Text))
                                              Or IsBlank(Trim(txtDokuMassnahmen.Text))
                                              Or IsBlank(Trim(txtDokuReaktion.Text))
                                              Or IsBlank(drpDokuTherapeut.Selected.Value),
                                          Set(gblMeldung, "Bitte Situation, Maßnahmen, Reaktion und den behandelnden Physio ausfüllen.");
                                          Set(gblMeldungArt, "Warnung"),

                                          Set(gblSpeichert, true);
                                          Set(gblFehlerText, "");
                                          Set(
                                              gblSchreibErgebnis,
                                              IfError(
                                                  Patch(
                                                      Behandlungsdokumentation,
                                                      // Vorhandene Zeile weiterschreiben - wiederholtes
                                                      // Speichern erzeugt KEINE zweite Zeile.
                                                      If(IsBlank(gblDoku), Defaults(Behandlungsdokumentation), gblDoku),
                                                      {
                                                          PatientID: gblPatient.ID,
                                                          RezeptID: gblRezept.ID,
                                                          Behandlungsdatum: dpDokuDatum.SelectedDate,
                                                          Therapeut: { Value: drpDokuTherapeut.Selected.Value },
                                                          Terminstatus: { Value: drpDokuTermin.Selected.Value },
                                                          // ACHTUNG Anzeigename: Die Behandlungsmenge dieser
                                                          // Zeile liegt in der Spalte mit dem Anzeigenamen
                                                          // "AltEinheiten" (interner Name "Einheiten").
                                                          // Siehe 03_Datenmodell.md, Befund 3.
                                                          AltEinheiten: If(chkDokuAbweichend.Value, Coalesce(Value(txtDokuMenge.Text), 1), 1),
                                                          Situation: txtDokuSituation.Text,
                                                          Massnahmen: txtDokuMassnahmen.Text,
                                                          Reaktion: txtDokuReaktion.Text,
                                                          Heimuebungen: txtDokuHeim.Text,
                                                          WeiteresVorgehen: txtDokuVorgehen.Text,
                                                          Status: { Value: "Entwurf" },
                                                          KorrekturZu: If(gblKorrekturZu > 0, gblKorrekturZu, Blank())
                                                      }
                                                  ),
                                                  Set(gblFehlerText, FirstError.Message); Blank()
                                              )
                                          );
                                          If(
                                              IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                              Set(gblMeldung, "Speichern fehlgeschlagen. Ihre Eingaben bleiben erhalten. " & gblFehlerText);
                                              Set(gblMeldungArt, "Fehler"),

                                              Set(gblDoku, gblSchreibErgebnis);
                                              Set(gblKorrekturZu, 0);
                                              Set(gblPruefeDoku, false);
                                              Set(gblUngespeichert, false);
                                              Set(gblDokuMassnahmenText, Blank());
                                              // Der Rezeptzaehler wird vom Flow neu berechnet.
                                              // Bis dahin gilt der angezeigte Stand als veraltet.
                                              Set(gblZaehlerAngefordert, Now());
                                              Set(gblMeldung, "Entwurf gespeichert (Eintrag " & gblSchreibErgebnis.ID & ").");
                                              Set(gblMeldungArt, "Erfolg")
                                          );
                                          Set(gblSpeichert, false)
                                      )
                                    Fill: =clrFlaeche
                                    Color: =clrAkzent
                                    BorderColor: =clrAkzent
                                    BorderThickness: =1
                                    HoverFill: =clrAkzentSanft
                                    DisabledFill: =clrHintergrund
                                    DisabledColor: =clrTextLeise
                                    Size: =fsNormal
                                    Height: =hTouch
                                    Width: =200
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                              - btnDokuGeprueft:
                                  Control: Classic/Button
                                  Properties:
                                    Text: ="Als geprüft markieren"
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(
                                          gblSpeichert
                                              Or IsBlank(gblDoku)
                                              Or Coalesce(gblDoku.Status.Value, "Entwurf") <> "Entwurf",
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    OnSelect: |-
                                      =Set(gblSpeichert, true);
                                      Set(gblFehlerText, "");
                                      Set(
                                          gblSchreibErgebnis,
                                          IfError(
                                              Patch(Behandlungsdokumentation, gblDoku, { Status: { Value: "Geprüft" } }),
                                              Set(gblFehlerText, FirstError.Message); Blank()
                                          )
                                      );
                                      If(
                                          IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                          Set(gblMeldung, "Der Status konnte nicht gesetzt werden. " & gblFehlerText);
                                          Set(gblMeldungArt, "Fehler"),

                                          Set(gblDoku, gblSchreibErgebnis);
                                          Set(gblMeldung, "Eintrag als geprüft markiert.");
                                          Set(gblMeldungArt, "Erfolg")
                                      );
                                      Set(gblSpeichert, false)
                                    Fill: =clrFlaeche
                                    Color: =clrText
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    HoverFill: =clrHintergrund
                                    DisabledFill: =clrHintergrund
                                    DisabledColor: =clrTextLeise
                                    Size: =fsNormal
                                    Height: =hTouch
                                    Width: =220
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                              - btnDokuFreigeben:
                                  Control: Classic/Button
                                  Properties:
                                    Text: =If(gblSpeichert, "Speichert ...", "Dokumentation freigeben")
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(
                                          gblSpeichert
                                              Or IsBlank(gblDoku)
                                              Or Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben",
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    OnSelect: |-
                                      =Set(gblSpeichert, true);
                                      Set(gblFehlerText, "");
                                      Set(
                                          gblSchreibErgebnis,
                                          IfError(
                                              Patch(
                                                  Behandlungsdokumentation,
                                                  gblDoku,
                                                  {
                                                      Status: { Value: "Freigegeben" },
                                                      // "Freigegeben am" ist derzeit ein Datumsfeld OHNE
                                                      // Uhrzeit. Solange das so ist, wird nur das Datum
                                                      // geschrieben. Siehe 03_Datenmodell.md, Befund 8.
                                                      'Freigegeben am': Today(),
                                                      // "Freigegeben von" IST ein Personenfeld
                                                      // (im Unterschied zu "Therapeut").
                                                      'Freigegeben von': {
                                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                          Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                          DisplayName: User().FullName,
                                                          Email: User().Email,
                                                          Department: "",
                                                          JobTitle: "",
                                                          Picture: ""
                                                      }
                                                  }
                                              ),
                                              Set(gblFehlerText, FirstError.Message); Blank()
                                          )
                                      );
                                      If(
                                          IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                          Set(gblMeldung, "Die Freigabe konnte nicht gespeichert werden. Der Eintrag bleibt unverändert. " & gblFehlerText);
                                          Set(gblMeldungArt, "Fehler"),

                                          Set(gblDoku, gblSchreibErgebnis);
                                          Set(gblUngespeichert, false);
                                          Set(gblMeldung, "Dokumentation freigegeben. Der Eintrag ist jetzt schreibgeschützt.");
                                          Set(gblMeldungArt, "Erfolg")
                                      );
                                      Set(gblSpeichert, false)
                                    Fill: =clrAkzent
                                    Color: =clrFlaecheWeiss
                                    HoverFill: =clrAkzentDunkel
                                    PressedFill: =clrAkzentDunkel
                                    DisabledFill: =clrRahmen
                                    DisabledColor: =clrTextLeise
                                    BorderThickness: =0
                                    Size: =fsNormal
                                    FontWeight: =FontWeight.Semibold
                                    Height: =hTouch
                                    Width: =230
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                              - btnDokuNeu:
                                  Control: Classic/Button
                                  Properties:
                                    Text: ="Neue Behandlung"
                                    DisplayMode: =If(gblSpeichert, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =If(
                                          gblUngespeichert,
                                          Set(gblMeldung, "Es gibt ungespeicherte Eingaben. Bitte zuerst speichern oder die Eingaben oben verwerfen.");
                                          Set(gblMeldungArt, "Warnung"),

                                          Set(gblDoku, Blank());
                                          Set(gblKorrekturZu, 0);
                                          Set(gblDokuMassnahmenText, Blank());
                                          Set(gblPruefeDoku, false);
                                          Set(gblFormularReset, true); Set(gblFormularReset, false);
                                          Set(gblMeldung, ""); Set(gblMeldungArt, "")
                                      )
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Color: =clrText
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    HoverFill: =clrHintergrund
                                    Size: =fsNormal
                                    Height: =hTouch
                                    Width: =190
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: AUFGABEN
                  # =====================================================
                  - conViewAufgaben:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Aufgaben"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - conAufgKopf:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =0
                              Height: =56
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =spM
                            Children:
                              - lblAufgTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Aufgaben"
                                    Color: =clrText
                                    Size: =fsTitel
                                    FontWeight: =FontWeight.Semibold
                                    FillPortions: =1
                                    Height: =40
                                    Wrap: =false
                                    PaddingLeft: =0
                                    VerticalAlign: =VerticalAlign.Middle
                              - drpAufgFilter:
                                  Control: Classic/DropDown
                                  Properties:
                                    Items: =["Offen", "Zurückgestellt", "Erledigt"]
                                    Default: ="Offen"
                                    Height: =hTouch
                                    Width: =220
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal

                        - conAufgListe:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblAufgLeer:
                                  Control: Label
                                  Properties:
                                    Visible: =CountRows(galAufgaben.AllItems) = 0
                                    Text: |-
                                      ="Keine Aufgaben mit dem Status """ & drpAufgFilter.Selected.Value & """."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =24
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - galAufgaben:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =Sort(
                                          Filter(AufgabenEinstellungen, Aufgabenstatus.Value = drpAufgFilter.Selected.Value),
                                          ID,
                                          SortOrder.Descending
                                      )
                                    Layout: =Layout.Vertical
                                    TemplateSize: =98
                                    TemplatePadding: =0
                                    FillPortions: =1
                                    ShowScrollbar: =true
                                    DelayItemLoading: =true
                                  Children:
                                    - rectAufgListeZeile:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrFlaeche
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                          X: =0
                                          Y: =0
                                          OnSelect: =Select(Parent)
                                    - rectAufgListeTrenner:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrRahmen
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          OnSelect: =Select(Parent)
                                    - lblAufgListeTyp:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =Coalesce(ThisItem.Typart.Value, "Aufgabe") &
                                             If(IsBlank(ThisItem.RezeptID), "", "  |  Rezept " & ThisItem.RezeptID)
                                          Color: =clrText
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          X: =spS
                                          Y: =10
                                          Width: =Parent.TemplateWidth - 380
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblAufgListeText:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =Coalesce(ThisItem.Beschreibung, "ohne Beschreibung") &
                                             If(IsBlank(ThisItem.Wiedervorlage), "",
                                                Char(10) & "Wiedervorlage: " & Text(ThisItem.Wiedervorlage, DateTimeFormat.ShortDate))
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          X: =spS
                                          Y: =36
                                          Width: =Parent.TemplateWidth - 380
                                          Height: =50
                                          Wrap: =true
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblAufgListeVeraltet:
                                        Control: Label
                                        Properties:
                                          # Nicht mehr zutreffende Aufgaben werden nicht still
                                          # geloescht, sondern sichtbar gekennzeichnet.
                                          Visible: =ThisItem.NichtAktuell
                                          Text: ="nicht mehr aktuell"
                                          Color: =clrWarnung
                                          Fill: =clrWarnungSanft
                                          Size: =fsKlein
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          X: =Parent.TemplateWidth - 370
                                          Y: =34
                                          Width: =160
                                          Height: =28
                                          Wrap: =false
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          OnSelect: =Select(Parent)
                                    - btnAufgZurueckstellen:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="7 Tage zurückstellen"
                                          DisplayMode: |-
                                            =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                            =If(gblSpeichert Or Coalesce(ThisItem.Aufgabenstatus.Value, "") = "Erledigt",
                                                DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblSpeichert, true);
                                            Set(gblFehlerText, "");
                                            Set(
                                                gblSchreibErgebnis,
                                                IfError(
                                                    Patch(AufgabenEinstellungen, ThisItem,
                                                        {
                                                            Aufgabenstatus: { Value: "Zurückgestellt" },
                                                            Wiedervorlage: DateAdd(Today(), 7, TimeUnit.Days)
                                                        }),
                                                    Set(gblFehlerText, FirstError.Message); Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                Set(gblMeldung, "Die Aufgabe konnte nicht zurückgestellt werden. " & gblFehlerText);
                                                Set(gblMeldungArt, "Fehler"),
                                                Set(gblMeldung, "Aufgabe auf " & Text(DateAdd(Today(), 7, TimeUnit.Days), DateTimeFormat.ShortDate) & " zurückgestellt.");
                                                Set(gblMeldungArt, "Erfolg")
                                            );
                                            Set(gblSpeichert, false)
                                          Fill: =clrFlaeche
                                          Color: =clrText
                                          BorderColor: =clrRahmen
                                          BorderThickness: =1
                                          HoverFill: =clrHintergrund
                                          DisabledFill: =clrHintergrund
                                          DisabledColor: =clrTextLeise
                                          Size: =fsKlein
                                          X: =Parent.TemplateWidth - 370
                                          Y: =Parent.TemplateHeight / 2 - hTouch / 2
                                          Width: =176
                                          Height: =hTouch
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                          Visible: =Coalesce(ThisItem.Aufgabenstatus.Value, "") <> "Erledigt"
                                    - btnAufgErledigt:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Erledigt"
                                          DisplayMode: =If(gblSpeichert, DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =Set(gblSpeichert, true);
                                            Set(gblFehlerText, "");
                                            Set(
                                                gblSchreibErgebnis,
                                                IfError(
                                                    Patch(AufgabenEinstellungen, ThisItem,
                                                        {
                                                            Aufgabenstatus: { Value: "Erledigt" },
                                                            ErledigtAm: Now()
                                                        }),
                                                    Set(gblFehlerText, FirstError.Message); Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                                Set(gblMeldung, "Die Aufgabe konnte nicht abgeschlossen werden. " & gblFehlerText);
                                                Set(gblMeldungArt, "Fehler"),
                                                Set(gblMeldung, "Aufgabe erledigt.");
                                                Set(gblMeldungArt, "Erfolg")
                                            );
                                            Set(gblSpeichert, false)
                                          Fill: =clrAkzent
                                          Color: =clrFlaecheWeiss
                                          HoverFill: =clrAkzentDunkel
                                          DisabledFill: =clrRahmen
                                          DisabledColor: =clrTextLeise
                                          BorderThickness: =0
                                          Size: =fsKlein
                                          FontWeight: =FontWeight.Semibold
                                          X: =Parent.TemplateWidth - 184
                                          Y: =Parent.TemplateHeight / 2 - hTouch / 2
                                          Width: =176
                                          Height: =hTouch
                                          RadiusTopLeft: =radM
                                          RadiusTopRight: =radM
                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM
                                          Visible: =Coalesce(ThisItem.Aufgabenstatus.Value, "") <> "Erledigt"

                  # =====================================================
                  # ANSICHT: EINSTELLUNGEN
                  # =====================================================
                  - conViewEinstellungen:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Einstellungen"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - lblEinstTitel:
                            Control: Label
                            Properties:
                              Text: ="Einstellungen"
                              Color: =clrText
                              Size: =fsTitel
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0
                        - lblEinstBerechtigung:
                            Control: Label
                            Properties:
                              # Ausdruecklicher Hinweis: Ausblenden ist keine Berechtigung.
                              Text: ="Dieser Bereich wird für den normalen Behandlungsablauf nicht benötigt. Wer ihn tatsächlich ändern darf, wird über die SharePoint-Berechtigungen der Liste gesteuert. Ein Ausblenden in der App ersetzt keine Berechtigung."
                              Color: =clrTextLeise
                              Fill: =clrHintergrund
                              Size: =fsKlein
                              Height: =52
                              FillPortions: =0
                              Wrap: =true
                              PaddingLeft: =spS
                              PaddingRight: =spS
                              VerticalAlign: =VerticalAlign.Middle
                        - conEinstKarte:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =520
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblEinstFehlt:
                                  Control: Label
                                  Properties:
                                    Visible: =IsBlank(recEinstellungen)
                                    Text: ="Es wurde noch keine Einstellungszeile gefunden. Das Einrichtungsskript in 04_Setup legt sie an. Bis dahin gelten die angezeigten Standardwerte."
                                    Color: =clrWarnung
                                    Fill: =clrWarnungSanft
                                    Size: =fsKlein
                                    Height: =44
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =spS
                                    PaddingRight: =spS
                                    VerticalAlign: =VerticalAlign.Middle
                              - txtEinstRest:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Text(cfgRestschwelle)
                                    Reset: =gblFormularReset
                                    HintText: ="Erinnerung ab ... verbleibenden Einheiten"
                                    Format: =TextFormat.Number
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - txtEinstInaktiv:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Text(cfgInaktivTage)
                                    Reset: =gblFormularReset
                                    HintText: ="Hinweis nach ... Kalendertagen ohne Behandlung"
                                    Format: =TextFormat.Number
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - txtEinstAbrechnung:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =Text(cfgAbrechnungsschwelle)
                                    Reset: =gblFormularReset
                                    HintText: ="Abrechnungshinweis nach ... erbrachten Einheiten"
                                    Format: =TextFormat.Number
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - txtEinstMail:
                                  Control: Classic/TextInput
                                  Properties:
                                    Default: =cfgMailIntern
                                    Reset: =gblFormularReset
                                    HintText: ="Interne Empfängeradresse"
                                    Height: =hEingabe
                                    FillPortions: =0
                                    BorderColor: =clrRahmen
                                    BorderThickness: =1
                                    Size: =fsNormal
                                    PaddingLeft: =spM
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
                              - chkEinstVortag:
                                  Control: Classic/CheckBox
                                  Properties:
                                    Text: ="Erinnerung einen Tag vor der voraussichtlich letzten geplanten Behandlung"
                                    Default: =cfgVortagAktiv
                                    Reset: =gblFormularReset
                                    Height: =hTouch
                                    FillPortions: =0
                                    Size: =fsNormal
                                    Color: =clrText
                              - chkEinstVersand:
                                  Control: Classic/CheckBox
                                  Properties:
                                    # Anzeigename "VersandAktiv", interner Name "VerandAktiv".
                                    # Power Fx verwendet den Anzeigenamen, Flows den internen Namen.
                                    Text: ="E-Mail-Versand aktiv (Standard ist aus)"
                                    Default: =cfgVersandAktiv
                                    Reset: =gblFormularReset
                                    Height: =hTouch
                                    FillPortions: =0
                                    Size: =fsNormal
                                    Color: =clrText
                              - lblEinstVersandHinweis:
                                  Control: Label
                                  Properties:
                                    Text: ="Aus einer hinterlegten Adresse folgt noch keine aktive Versandverbindung. Der Versand wird erst durch den eingerichteten Flow und diesen Schalter wirksam."
                                    Color: =clrTextLeise
                                    Size: =fsKlein
                                    Height: =36
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - btnEinstSpeichern:
                                  Control: Classic/Button
                                  Properties:
                                    Text: =If(gblSpeichert, "Speichert ...", "Einstellungen speichern")
                                    DisplayMode: |-
                                      =If(Coalesce(gblDoku.Status.Value, "Entwurf") = "Freigegeben", DisplayMode.View, DisplayMode.Edit)
                                      =If(gblSpeichert Or IsBlank(recEinstellungen), DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =Set(gblSpeichert, true);
                                      Set(gblFehlerText, "");
                                      Set(
                                          gblSchreibErgebnis,
                                          IfError(
                                              Patch(AufgabenEinstellungen, recEinstellungen,
                                                  {
                                                      Restschwelle: Coalesce(Value(txtEinstRest.Text), 1),
                                                      InaktivTage: Coalesce(Value(txtEinstInaktiv.Text), 21),
                                                      Abrechnungsschwelle: Coalesce(Value(txtEinstAbrechnung.Text), 5),
                                                      MailIntern: Trim(txtEinstMail.Text),
                                                      VortagAktiv: chkEinstVortag.Value,
                                                      VersandAktiv: chkEinstVersand.Value
                                                  }),
                                              Set(gblFehlerText, FirstError.Message); Blank()
                                          )
                                      );
                                      If(
                                          IsBlank(gblSchreibErgebnis) Or IsBlank(gblSchreibErgebnis.ID),
                                          Set(gblMeldung, "Die Einstellungen konnten nicht gespeichert werden. " & gblFehlerText);
                                          Set(gblMeldungArt, "Fehler"),
                                          Set(gblMeldung, "Einstellungen gespeichert.");
                                          Set(gblMeldungArt, "Erfolg")
                                      );
                                      Set(gblSpeichert, false)
                                    Fill: =clrAkzent
                                    Color: =clrFlaecheWeiss
                                    HoverFill: =clrAkzentDunkel
                                    DisabledFill: =clrRahmen
                                    DisabledColor: =clrTextLeise
                                    BorderThickness: =0
                                    Size: =fsNormal
                                    FontWeight: =FontWeight.Semibold
                                    Height: =hTouch
                                    Width: =240
                                    FillPortions: =0
                                    RadiusTopLeft: =radM
                                    RadiusTopRight: =radM
                                    RadiusBottomLeft: =radM
                                    RadiusBottomRight: =radM
