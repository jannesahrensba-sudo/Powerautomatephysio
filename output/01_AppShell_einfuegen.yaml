# =====================================================================
# Physio Human Performance - Praxis-App
# Einfuegbarer Oberflaechencode für eine Canvas App (Power Apps Studio)
#
# Format:  Power Apps YAML (Schema pa-yaml v3.0), Control-Fragment
#          OHNE "Screens:"-Wrapper - genau das erwartet "Code einfügen".
#
# EINFUEGEN:  Rechtsklick auf den leeren Bildschirm in der Strukturansicht
#             -> "Code einfügen" (bzw. Strg+V bei geoeffneter Codeansicht).
#
# VORHER ZWINGEND ERLEDIGEN (sonst zeigen fast alle Formeln Fehler):
#   1. Die vier SharePoint-Listen als Datenquellen hinzufuegen.
#   2. Die App-Eigenschaften aus 02_Eigenschaften_DE.md setzen -
#      insbesondere App.Formulas (Farben, Abstände, Konfiguration).
#   Reihenfolge und Details stehen in START_HIER.md.
#
# Der Wurzelcontainer heißt conPraxisApp. Alle Breakpoint-Formeln
# beziehen sich auf conPraxisApp.Width und NICHT auf einen Bildschirmnamen.
# Dadurch ist der Code unabhängig davon, wie der Bildschirm heißt.
# =====================================================================

- conPraxisApp:
    Control: GroupContainer
    Variant: AutoLayout
    Properties:
      Fill: =clrHintergrund
      Height: =Parent.Height
      Width: =Parent.Width
      X: =0
      Y: =0
      # Breit (Desktop, iPad quer): Navigation links neben dem Inhalt.
      # Schmal (iPhone, iPad hochkant schmal): Navigation oben, Inhalt darunter.
      LayoutDirection: =If(Parent.Width >= bpBreit, LayoutDirection.Horizontal, LayoutDirection.Vertical)
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =0
      LayoutWrap: =false
    Children:

      # ---------------------------------------------------------------
      # 1) NAVIGATION
      # ---------------------------------------------------------------
      - conNav:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =clrAkzentDunkel
            FillPortions: =0
            Width: =If(conPraxisApp.Width >= bpBreit, 248, conPraxisApp.Width)
            Height: =If(conPraxisApp.Width >= bpBreit, conPraxisApp.Height, 132)
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            PaddingTop: =spS
            PaddingBottom: =spS
            PaddingLeft: =spS
            PaddingRight: =spS
          Children:

            - lblMarke:
                Control: Label
                Properties:
                  Text: ="Physio Human Performance"
                  Color: =clrFlaecheWeiss
                  Size: =fsNormal
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  FillPortions: =0
                  PaddingLeft: =spS
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
                  Visible: =conPraxisApp.Width >= bpBreit

            - lblMarkeKurz:
                Control: Label
                Properties:
                  Text: ="Praxis-App"
                  Color: =clrFlaecheWeiss
                  Size: =fsNormal
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  FillPortions: =0
                  PaddingLeft: =spS
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =false
                  Visible: =conPraxisApp.Width < bpBreit

            # Die Navigation ist eine Galerie, damit sie auf breiten Geraeten
            # senkrecht und auf schmalen Geraeten waagerecht laufen kann.
            - galNav:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |-
                    =Table(
                        { Bez: "Heute",         Sym: Icon.Home },
                        { Bez: "Patienten",     Sym: Icon.People },
                        { Bez: "Patientenakte", Sym: Icon.Person },
                        { Bez: "Aufnahme",      Sym: Icon.AddDocument },
                        { Bez: "Rezepte",       Sym: Icon.Document },
                        { Bez: "Behandlung",    Sym: Icon.Edit },
                        { Bez: "Aufgaben",      Sym: Icon.CheckBadge },
                        { Bez: "Einstellungen", Sym: Icon.Settings }
                    )
                  Layout: =If(conPraxisApp.Width >= bpBreit, Layout.Vertical, Layout.Horizontal)
                  TemplateSize: =If(conPraxisApp.Width >= bpBreit, 48, 104)
                  TemplatePadding: =0
                  FillPortions: =1
                  Height: =If(conPraxisApp.Width >= bpBreit, conNav.Height - 68, 76)
                  ShowScrollbar: =false
                  DelayItemLoading: =false
                  TabIndex: =0
                Children:
                  - rectNavAktiv:
                      Control: Rectangle
                      Properties:
                        Fill: =If(ThisItem.Bez = gblAnsicht, clrAkzent, RGBA(0, 0, 0, 0))
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        X: =0
                        Y: =0
                        OnSelect: |-
                          =Select(icoNav)
                  - icoNav:
                      Control: Classic/Icon
                      Properties:
                        Icon: =ThisItem.Sym
                        Color: =If(ThisItem.Bez = gblAnsicht, clrFlaecheWeiss, clrNavRuhe)
                        Width: =24
                        Height: =24
                        X: =If(conPraxisApp.Width >= bpBreit, spM, (Parent.TemplateWidth - 24) / 2)
                        Y: =If(conPraxisApp.Width >= bpBreit, (Parent.TemplateHeight - 24) / 2, 12)
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AccessibleLabel: =ThisItem.Bez
                        Tooltip: =ThisItem.Bez
                        TabIndex: =0
                        OnSelect: |-
                          =If(
                              gblUngespeichert And ThisItem.Bez <> gblAnsicht,
                              // Ungespeicherte Eingaben: erst nachfragen, nicht einfach verwerfen.
                              Set(gblWechselZiel, ThisItem.Bez); Set(gblFrageWechsel, true),
                              Set(gblAnsicht, ThisItem.Bez); Set(gblMeldung, ""); Set(gblMeldungArt, "")
                          )
                  - lblNav:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Bez
                        Color: =If(ThisItem.Bez = gblAnsicht, clrFlaecheWeiss, clrNavRuhe)
                        Size: =If(conPraxisApp.Width >= bpBreit, fsNormal, fsKlein)
                        FontWeight: =If(ThisItem.Bez = gblAnsicht, FontWeight.Semibold, FontWeight.Normal)
                        Align: =If(conPraxisApp.Width >= bpBreit, Align.Left, Align.Center)
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        X: =If(conPraxisApp.Width >= bpBreit, 52, 0)
                        Y: =If(conPraxisApp.Width >= bpBreit, 0, 40)
                        Width: =If(conPraxisApp.Width >= bpBreit, Parent.TemplateWidth - 60, Parent.TemplateWidth)
                        Height: =If(conPraxisApp.Width >= bpBreit, Parent.TemplateHeight, 28)
                        PaddingLeft: =0
                        PaddingRight: =0
                        OnSelect: |-
                          =Select(icoNav)

            - lblNavFuss:
                Control: Label
                Properties:
                  Text: |-
                    ="Angemeldet: " & Coalesce(User().FullName, "unbekannt")
                  Color: =clrNavRuhe
                  Size: =fsKlein
                  Height: =24
                  FillPortions: =0
                  PaddingLeft: =spS
                  Wrap: =false
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =conPraxisApp.Width >= bpBreit

      # ---------------------------------------------------------------
      # 2) ARBEITSBEREICH: Patientenkopf, Meldungen, Ansichten
      # ---------------------------------------------------------------
      - conArbeitsbereich:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =clrHintergrund
            FillPortions: =1
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:

            # --- Patientenkopf: immer sichtbar, nie scrollend ---------
            - conKopf:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =clrFlaeche
                  FillPortions: =0
                  Height: =If(conPraxisApp.Width >= bpMittel, 88, 128)
                  LayoutDirection: =If(conPraxisApp.Width >= bpMittel, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =spM
                  PaddingTop: =spS
                  PaddingBottom: =spS
                  PaddingLeft: =spL
                  PaddingRight: =spL
                  BorderColor: =clrRahmen
                  BorderThickness: =1
                  BorderStyle: =BorderStyle.Solid
                Children:
                  - conKopfPatient:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =2
                      Children:
                        - lblKopfName:
                            Control: Label
                            Properties:
                              Text: |-
                                =If(
                                    IsBlank(gblPatient),
                                    "Kein Patient ausgewählt",
                                    Trim(Coalesce(gblPatient.Vorname, "") & " " & Coalesce(gblPatient.Nachname, ""))
                                )
                              Color: =If(IsBlank(gblPatient), clrTextLeise, clrText)
                              Size: =fsGross
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0
                              VerticalAlign: =VerticalAlign.Middle
                        - lblKopfDetails:
                            Control: Label
                            Properties:
                              Text: |-
                                =If(
                                    IsBlank(gblPatient),
                                    "Bitte im Bereich Patienten einen Patienten wählen oder neu aufnehmen.",
                                    Concatenate(
                                        If(IsBlank(gblPatient.Geburtsdatum), "Geburtsdatum unbekannt",
                                           "geb. " & Text(gblPatient.Geburtsdatum, DateTimeFormat.ShortDate)),
                                        "   |   ",
                                        If(IsBlank(gblPatient.'Patienten ID'), "ohne Patientennummer",
                                           "Nr. " & gblPatient.'Patienten ID')
                                    )
                                )
                              Color: =clrTextLeise
                              Size: =fsKlein
                              Height: =20
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0
                              VerticalAlign: =VerticalAlign.Middle
                  - conKopfRezept:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =If(IsBlank(gblRezept), clrHintergrund, clrAkzentSanft)
                        FillPortions: =0
                        Width: =If(conPraxisApp.Width >= bpMittel, 300, conKopf.Width - 2 * spL)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =0
                        PaddingTop: =spS
                        PaddingBottom: =spS
                        PaddingLeft: =spM
                        PaddingRight: =spM
                        RadiusTopLeft: =radM
                        RadiusTopRight: =radM
                        RadiusBottomLeft: =radM
                        RadiusBottomRight: =radM
                      Children:
                        - lblKopfRezept:
                            Control: Label
                            Properties:
                              # Der Anzeigename der Titelspalte im Rezept ist NICHT bestätigt
                              # (Title / Titel / Rezeptname - siehe 03_Datenmodell.md).
                              # Deshalb wird hier bewusst kein Titelfeld gelesen, sondern eine
                              # eindeutige Bezeichnung aus ID und Diagnose gebildet.
                              Text: |-
                                =If(
                                    IsBlank(gblRezept),
                                    "Kein Rezept ausgewählt",
                                    "Rezept " & gblRezept.ID &
                                    If(IsBlank(gblRezept.'Diagnose laut Rezept'), "",
                                       " - " & gblRezept.'Diagnose laut Rezept')
                                )
                              Color: =clrText
                              Size: =fsNormal
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0
                              VerticalAlign: =VerticalAlign.Middle
                        - lblKopfStand:
                            Control: Label
                            Properties:
                              # "Keine Berechnung" darf niemals wie "0 offen" aussehen.
                              Text: |-
                                =If(
                                    IsBlank(gblRezept),
                                    "Bereich Rezepte öffnen",
                                    IsBlank(gblRezept.ZaehlerStand),
                                    "Einheiten noch nicht berechnet",
                                    gblZaehlerAngefordert > gblRezept.ZaehlerStand,
                                    "Wird neu berechnet - Stand von " & Text(gblRezept.ZaehlerStand, DateTimeFormat.ShortDateTime),
                                    Coalesce(gblRezept.Offen, 0) & " von " & Coalesce(gblRezept.Behandlungseinheiten, 0) &
                                    " Einheiten offen (Stand " & Text(gblRezept.ZaehlerStand, DateTimeFormat.ShortDateTime) & ")"
                                )
                              Color: |-
                                =If(
                                    IsBlank(gblRezept) Or IsBlank(gblRezept.ZaehlerStand), clrWarnung,
                                    gblZaehlerAngefordert > gblRezept.ZaehlerStand, clrWarnung,
                                    clrTextLeise
                                )
                              Size: =fsKlein
                              Height: =20
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0
                              VerticalAlign: =VerticalAlign.Middle
                  - btnKopfAktualisieren:
                      Control: Classic/Button
                      Properties:
                        Text: ="Stand aktualisieren"
                        OnSelect: |-
                          =IfError(
                              Refresh(Rezepte);
                              Set(gblRezept, LookUp(Rezepte, ID = gblRezept.ID));
                              Set(gblMeldung, "Rezeptstand neu geladen."); Set(gblMeldungArt, "Erfolg"),
                              Set(gblMeldung, "Rezeptstand konnte nicht geladen werden: " & FirstError.Message);
                              Set(gblMeldungArt, "Fehler")
                          )
                        Fill: =RGBA(0, 0, 0, 0)
                        Color: =clrAkzent
                        BorderColor: =clrRahmen
                        BorderThickness: =1
                        HoverFill: =clrAkzentSanft
                        HoverColor: =clrAkzentDunkel
                        PressedFill: =clrAkzentSanft
                        PressedColor: =clrAkzentDunkel
                        Size: =fsKlein
                        Height: =hTouch
                        Width: =176
                        FillPortions: =0
                        RadiusTopLeft: =radM
                        RadiusTopRight: =radM
                        RadiusBottomLeft: =radM
                        RadiusBottomRight: =radM
                        DisplayMode: =If(IsBlank(gblRezept), DisplayMode.Disabled, DisplayMode.Edit)
                        Visible: =conPraxisApp.Width >= bpMittel

            # --- Meldungsleiste: Erfolg, Warnung, Fehler --------------
            - conMeldung:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =Not(IsBlank(gblMeldung))
                  Fill: |-
                    =Switch(gblMeldungArt,
                        "Erfolg", clrErfolgSanft,
                        "Warnung", clrWarnungSanft,
                        "Fehler", clrFehlerSanft,
                        clrAkzentSanft)
                  FillPortions: =0
                  Height: =52
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =spM
                  PaddingLeft: =spL
                  PaddingRight: =spL
                Children:
                  - lblMeldung:
                      Control: Label
                      Properties:
                        Text: =gblMeldung
                        Color: |-
                          =Switch(gblMeldungArt,
                              "Erfolg", clrErfolg,
                              "Warnung", clrWarnung,
                              "Fehler", clrFehler,
                              clrText)
                        Size: =fsNormal
                        FillPortions: =1
                        Height: =40
                        Wrap: =true
                        PaddingLeft: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Live: =Live.Polite
                  - btnMeldungZu:
                      Control: Classic/Button
                      Properties:
                        Text: ="Schließen"
                        OnSelect: |-
                          =Set(gblMeldung, ""); Set(gblMeldungArt, "")
                        Fill: =RGBA(0, 0, 0, 0)
                        Color: =clrText
                        BorderColor: =clrRahmen
                        BorderThickness: =1
                        HoverFill: =clrFlaeche
                        Size: =fsKlein
                        Height: =hTouch
                        Width: =120
                        FillPortions: =0
                        RadiusTopLeft: =radM
                        RadiusTopRight: =radM
                        RadiusBottomLeft: =radM
                        RadiusBottomRight: =radM

            # --- Rueckfrage bei ungespeicherten Eingaben --------------
            - conFrageWechsel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =gblFrageWechsel
                  Fill: =clrWarnungSanft
                  FillPortions: =0
                  Height: =60
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =spS
                  PaddingLeft: =spL
                  PaddingRight: =spL
                Children:
                  - lblFrageWechsel:
                      Control: Label
                      Properties:
                        Text: ="Es gibt ungespeicherte Eingaben. Wie möchten Sie fortfahren?"
                        Color: =clrWarnung
                        Size: =fsNormal
                        FillPortions: =1
                        Height: =44
                        Wrap: =true
                        PaddingLeft: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Live: =Live.Assertive
                  - btnWechselBleiben:
                      Control: Classic/Button
                      Properties:
                        Text: ="Hier bleiben"
                        OnSelect: |-
                          =Set(gblFrageWechsel, false); Set(gblWechselZiel, "")
                        Fill: =clrFlaeche
                        Color: =clrText
                        BorderColor: =clrRahmen
                        BorderThickness: =1
                        Size: =fsKlein
                        Height: =hTouch
                        Width: =150
                        FillPortions: =0
                        RadiusTopLeft: =radM
                        RadiusTopRight: =radM
                        RadiusBottomLeft: =radM
                        RadiusBottomRight: =radM
                  - btnWechselVerwerfen:
                      Control: Classic/Button
                      Properties:
                        Text: ="Eingaben verwerfen"
                        OnSelect: |-
                          =Set(gblUngespeichert, false);
                          Set(gblFrageWechsel, false);
                          Set(gblAnsicht, Coalesce(gblWechselZiel, gblAnsicht));
                          Set(gblWechselZiel, "");
                          Set(gblMeldung, ""); Set(gblMeldungArt, "");
                          Set(gblFormularReset, true); Set(gblFormularReset, false)
                        Fill: =clrWarnung
                        Color: =clrFlaecheWeiss
                        BorderThickness: =0
                        Size: =fsKlein
                        Height: =hTouch
                        Width: =196
                        FillPortions: =0
                        RadiusTopLeft: =radM
                        RadiusTopRight: =radM
                        RadiusBottomLeft: =radM
                        RadiusBottomRight: =radM

            # --- Inhaltsbereich: genau eine Ansicht ist sichtbar ------
            # Unsichtbare Kinder belegen im Auto-Layout keinen Platz,
            # deshalb duerfen alle Ansichten FillPortions = 1 haben.
            - conInhalt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:

                  # =====================================================
                  # ANSICHT: HEUTE
                  # =====================================================
                  - conViewHeute:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =gblAnsicht = "Heute"
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =spM
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =spL
                        PaddingBottom: =spL
                        PaddingLeft: =spL
                        PaddingRight: =spL
                      Children:
                        - lblHeuteTitel:
                            Control: Label
                            Properties:
                              Text: |-
                                ="Heute, " & Text(Today(), DateTimeFormat.LongDate)
                              Color: =clrText
                              Size: =fsTitel
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              FillPortions: =0
                              Wrap: =false
                              PaddingLeft: =0

                        # --- Karte: heutige Dokumentationen ------------
                        - conHeuteDoku:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =clrFlaeche
                              FillPortions: =0
                              Height: =360
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =spS
                              PaddingTop: =spM
                              PaddingBottom: =spM
                              PaddingLeft: =spM
                              PaddingRight: =spM
                              BorderColor: =clrRahmen
                              BorderThickness: =1
                              BorderStyle: =BorderStyle.Solid
                              RadiusTopLeft: =radL
                              RadiusTopRight: =radL
                              RadiusBottomLeft: =radL
                              RadiusBottomRight: =radL
                            Children:
                              - lblHeuteDokuTitel:
                                  Control: Label
                                  Properties:
                                    Text: ="Termine und Dokumentationen von heute"
                                    Color: =clrText
                                    Size: =fsGross
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    FillPortions: =0
                                    Wrap: =false
                                    PaddingLeft: =0
                              - lblHeuteDokuHinweis:
                                  Control: Label
                                  Properties:
                                    # Es gibt keine angebundene Terminplanung. Gezeigt wird der
                                    # tatsächliche Dokumentationsstand - keine erfundenen Termine.
                                    Text: |-
                                      =If(
                                          gblLadeFehlerHeute,
                                          "Die Liste konnte nicht geladen werden. Bitte Verbindung prüfen und erneut laden.",
                                          CountRows(galHeuteDoku.AllItems) = 0,
                                          "Für heute ist noch nichts erfasst. Mit ""Termin erfassen"" legen Sie einen Eintrag an.",
                                          CountRows(galHeuteDoku.AllItems) & " Einträge für heute."
                                      )
                                    Color: =If(gblLadeFehlerHeute, clrFehler, clrTextLeise)
                                    Size: =fsKlein
                                    Height: =20
                                    FillPortions: =0
                                    Wrap: =true
                                    PaddingLeft: =0
                              - galHeuteDoku:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    # Zeitraumfilter statt "= Today()", weil die Datumsspalten
                                    # teilweise noch ohne Uhrzeit gefuehrt werden.
                                    Items: |-
                                      =Sort(
                                          Filter(
                                              Behandlungsdokumentation,
                                              Behandlungsdatum >= Today(),
                                              Behandlungsdatum < DateAdd(Today(), 1, TimeUnit.Days)
                                          ),
                                          ID,
                                          SortOrder.Ascending
                                      )
                                    Layout: =Layout.Vertical
                                    TemplateSize: =72
                                    TemplatePadding: =0
                                    FillPortions: =1
                                    ShowScrollbar: =true
                                    DelayItemLoading: =true
                                  Children:
                                    - rectHeuteZeile:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =If(ThisItem.IsSelected, clrAkzentSanft, clrFlaeche)
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight - 1
                                          X: =0
                                          Y: =0
                                          OnSelect: =Select(Parent)
                                    - rectHeuteTrenner:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =clrRahmen
                                          Width: =Parent.TemplateWidth
                                          Height: =1
                                          X: =0
                                          Y: =Parent.TemplateHeight - 1
                                          OnSelect: =Select(Parent)
                                    - lblHeuteName:
                                        Control: Label
                                        Properties:
                                          # Ein LookUp je Zeile ist hier vertretbar: es geht um
                                          # die Einträge eines einzigen Tages.
                                          Text: |-
                                            =With(
                                                { p: LookUp(Patientenstamm, ID = ThisItem.PatientID) },
                                                If(IsBlank(p),
                                                   "Patient nicht auffindbar (PatientID " & Coalesce(Text(ThisItem.PatientID), "leer") & ")",
                                                   Trim(Coalesce(p.Vorname, "") & " " & Coalesce(p.Nachname, "")))
                                            )
                                          Color: =clrText
                                          Size: =fsNormal
                                          FontWeight: =FontWeight.Semibold
                                          X: =spS
                                          Y: =10
                                          Width: =Parent.TemplateWidth - 340
                                          Height: =24
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblHeuteZeit:
                                        Control: Label
                                        Properties:
                                          Text: |-
                                            =Coalesce(ThisItem.Terminstatus.Value, "ohne Terminstatus") &
                                             "  |  Rezept " & Coalesce(Text(ThisItem.RezeptID), "-")
                                          Color: =clrTextLeise
                                          Size: =fsKlein
                                          X: =spS
                                          Y: =36
                                          Width: =Parent.TemplateWidth - 340
                                          Height: =20
                                          Wrap: =false
                                          PaddingLeft: =0
                                          OnSelect: =Select(Parent)
                                    - lblHeuteStatus:
                                        Control: Label
                                        Properties:
                                          Text: =Coalesce(ThisItem.Status.Value, "Entwurf")
                                          Color: |-
                                            =Switch(Coalesce(ThisItem.Status.Value, "Entwurf"),
                                                "Freigegeben", clrErfolg,
                                                "Geprüft", clrAkzentDunkel,
                                                clrWarnung)
                                          Fill: |-
                                            =Switch(Coalesce(ThisItem.Status.Value, "Entwurf"),
                                                "Freigegeben", clrErfolgSanft,
                                                "Geprüft", clrAkzentSanft,
                                                clrWarnungSanft)
                                          Size: =fsKlein
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          X: =Parent.TemplateWidth - 320
                                          Y: =20
                                          Width: =130
                                          Height: =32
