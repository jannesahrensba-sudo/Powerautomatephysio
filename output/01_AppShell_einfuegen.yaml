                                          RadiusBottomLeft: =radM
                                          RadiusBottomRight: =radM

                  # =====================================================
                  # ANSICHT: PATIENTEN (Suche und Auswahl)
                  # =====================================================
                  - conViewPatienten:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
